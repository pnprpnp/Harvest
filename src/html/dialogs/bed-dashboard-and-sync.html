<div id="bedDetailModal" class="bedDetailModal" role="dialog" aria-modal="true" aria-labelledby="bedDetailWindowTitle">
  <div class="bedDetailWindow">
    <div class="bedDetailWindowHeader">
      <div id="bedDetailWindowTitle" class="bedDetailWindowTitle">ベッド詳細</div>
      <button type="button" class="bedDetailWindowClose" onclick="closeBedDetailWindow()">閉じる</button>
    </div>
    <div id="bedDetailWindowBody" class="bedDetailWindowBody"></div>
  </div>
</div>
<div id="dashboardModal" class="dashboardModal" role="dialog" aria-modal="true" aria-labelledby="dashboardWindowTitle">
  <div class="dashboardWindow">
    <div class="dashboardWindowHeader">
      <div id="dashboardWindowTitle" class="dashboardWindowTitle">集計</div>
      <button type="button" class="dashboardWindowClose" onclick="closeDashboardWindow()">閉じる</button>
    </div>
    <div id="dashboardModalBody" class="dashboardWindowBody"></div>
  </div>
</div>
<div id="dashboardStorage" style="display:none;"></div>
<div id="googleSheetConfirmPanel" class="googleSheetConfirmPanel" role="dialog" aria-modal="true" aria-labelledby="googleSheetConfirmTitle">
  <div id="googleSheetConfirmTitle" class="googleSheetConfirmTitle">スプレッドシートへ送信</div>
  <div id="googleSheetConfirmMessage" class="googleSheetConfirmMessage"></div>
  <div class="googleSheetConfirmActions">
    <button type="button" class="googleSheetConfirmCancel" onclick="resolveGoogleSheetConfirm(false)">キャンセル</button>
    <button type="button" class="googleSheetConfirmSend" onclick="resolveGoogleSheetConfirm(true)">送信する</button>
  </div>
</div>
<div id="appUpdateConfirmPanel" class="appUpdateConfirmOverlay">
  <div class="googleSheetConfirmPanel appUpdateConfirmWindow" role="dialog" aria-modal="true" aria-labelledby="appUpdateConfirmTitle" aria-describedby="appUpdateConfirmMessage">
    <div id="appUpdateConfirmTitle" class="googleSheetConfirmTitle">アプリの更新</div>
    <div id="appUpdateConfirmMessage" class="googleSheetConfirmMessage">最新版が見つかりました。更新しますか？</div>
    <div class="googleSheetConfirmActions">
      <button id="appUpdateConfirmNo" type="button" class="googleSheetConfirmCancel" onclick="resolveAppUpdateConfirm(false)">いいえ</button>
      <button id="appUpdateConfirmYes" type="button" class="googleSheetConfirmSend appUpdateConfirmYes" onclick="resolveAppUpdateConfirm(true)">はい</button>
    </div>
  </div>
</div>
<div id="plantingUnselectedWarningPanel" class="appUpdateConfirmOverlay">
  <div class="googleSheetConfirmPanel appUpdateConfirmWindow" role="dialog" aria-modal="true" aria-labelledby="plantingUnselectedWarningTitle" aria-describedby="plantingUnselectedWarningMessage">
    <div id="plantingUnselectedWarningTitle" class="googleSheetConfirmTitle">未定植場所の確認</div>
    <div id="plantingUnselectedWarningMessage" class="googleSheetConfirmMessage">以前の未定植の場所が選択されていません。</div>
    <div class="googleSheetConfirmActions plantingUnselectedWarningActions">
      <button id="plantingUnselectedConfirmNo" type="button" class="googleSheetConfirmCancel" onclick="resolvePlantingUnselectedWarning(false)">選択へ戻る</button>
      <button id="plantingUnselectedConfirmYes" type="button" class="googleSheetConfirmSend appUpdateConfirmYes" onclick="resolvePlantingUnselectedWarning(true)">このまま保存</button>
    </div>
  </div>
</div>
<div id="recordImportErrorPanel" class="recordImportErrorPanel" role="dialog" aria-modal="true" aria-labelledby="recordImportErrorTitle">
  <div id="recordImportErrorTitle" class="recordImportErrorTitle">読み込み失敗</div>
  <div id="recordImportErrorMessage" class="recordImportErrorMessage"></div>
  <button type="button" class="recordImportErrorClose" onclick="hideRecordImportError()">閉じる</button>
</div>
<div id="syncConflictPanel" class="appUpdateConfirmOverlay">
  <div class="syncConflictWindow" role="dialog" aria-modal="true" aria-labelledby="syncConflictTitle">
    <div class="syncConflictHeader">
      <div id="syncConflictTitle" class="syncConflictTitle">競合する記録</div>
      <button id="syncConflictCloseBtn" type="button" class="syncConflictClose" onclick="closeSyncConflictPanel()">閉じる</button>
    </div>
    <div class="syncConflictIntro">端末版とスプレッドシート版を両方保護しています。内容を比較して、残す方を選んでください。</div>
    <div id="syncConflictBulkActions" class="syncConflictBulkActions" hidden>
      <button id="syncConflictKeepAllLocalBtn" type="button" class="actionBtn thirdBtn" onclick="resolveAllSyncConflictsWithLocalVersions()">すべてこの端末の内容を残す</button>
      <div id="syncConflictBulkStatus" class="syncConflictBulkStatus" role="status" aria-live="polite" hidden></div>
    </div>
    <div id="syncConflictNavigator" class="syncConflictNavigator" hidden>
      <button id="syncConflictPreviousBtn" type="button" onclick="moveSyncConflictSelection(-1)">前の競合</button>
      <div id="syncConflictPosition" class="syncConflictPosition">1 / 1<span class="syncConflictVersionNote">表示版: local-all-v1</span></div>
      <button id="syncConflictNextBtn" type="button" onclick="moveSyncConflictSelection(1)">次の競合</button>
    </div>
    <div id="syncConflictList" class="syncConflictList"></div>
  </div>
</div>
