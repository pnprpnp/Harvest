<div id="bedDetailModal" class="bedDetailModal" role="dialog" aria-modal="true" aria-labelledby="bedDetailWindowTitle" data-ui-backdrop-click="closeBedDetailWindow">
  <div class="bedDetailWindow">
    <div class="bedDetailWindowHeader">
      <div id="bedDetailWindowTitle" class="bedDetailWindowTitle">ベッド詳細</div>
      <button type="button" class="bedDetailWindowClose" data-ui-click="closeBedDetailWindow">閉じる</button>
    </div>
    <div id="bedDetailWindowBody" class="bedDetailWindowBody"></div>
  </div>
</div>
<div id="dashboardModal" class="dashboardModal" role="dialog" aria-modal="true" aria-labelledby="dashboardWindowTitle" data-ui-backdrop-click="closeDashboardWindow">
  <div class="dashboardWindow">
    <div class="dashboardWindowHeader">
      <div id="dashboardWindowTitle" class="dashboardWindowTitle">集計</div>
      <button type="button" class="dashboardWindowClose" data-ui-click="closeDashboardWindow">閉じる</button>
    </div>
    <div id="dashboardModalBody" class="dashboardWindowBody"></div>
  </div>
</div>
<div id="dashboardStorage" style="display:none;"></div>
<div id="googleSheetConfirmPanel" class="googleSheetConfirmPanel" role="dialog" aria-modal="true" aria-labelledby="googleSheetConfirmTitle">
  <div id="googleSheetConfirmTitle" class="googleSheetConfirmTitle">スプレッドシートへ送信</div>
  <div id="googleSheetConfirmMessage" class="googleSheetConfirmMessage"></div>
  <div class="googleSheetConfirmActions">
    <button type="button" class="googleSheetConfirmCancel" data-ui-click="resolveGoogleSheetConfirm" data-ui-boolean="false">キャンセル</button>
    <button type="button" class="googleSheetConfirmSend" data-ui-click="resolveGoogleSheetConfirm" data-ui-boolean="true">送信する</button>
  </div>
</div>
<div id="appUpdateConfirmPanel" class="appUpdateConfirmOverlay">
  <div class="googleSheetConfirmPanel appUpdateConfirmWindow" role="dialog" aria-modal="true" aria-labelledby="appUpdateConfirmTitle" aria-describedby="appUpdateConfirmMessage">
    <div id="appUpdateConfirmTitle" class="googleSheetConfirmTitle">アプリの更新</div>
    <div id="appUpdateConfirmMessage" class="googleSheetConfirmMessage">最新版が見つかりました。更新しますか？</div>
    <div class="googleSheetConfirmActions">
      <button id="appUpdateConfirmNo" type="button" class="googleSheetConfirmCancel" data-ui-click="resolveAppUpdateConfirm" data-ui-boolean="false">いいえ</button>
      <button id="appUpdateConfirmYes" type="button" class="googleSheetConfirmSend appUpdateConfirmYes" data-ui-click="resolveAppUpdateConfirm" data-ui-boolean="true">はい</button>
    </div>
  </div>
</div>
<div id="plantingUnselectedWarningPanel" class="appUpdateConfirmOverlay">
  <div class="googleSheetConfirmPanel appUpdateConfirmWindow" role="dialog" aria-modal="true" aria-labelledby="plantingUnselectedWarningTitle" aria-describedby="plantingUnselectedWarningMessage">
    <div id="plantingUnselectedWarningTitle" class="googleSheetConfirmTitle">未定植場所の確認</div>
    <div id="plantingUnselectedWarningMessage" class="googleSheetConfirmMessage">以前の未定植の場所が選択されていません。</div>
    <div class="googleSheetConfirmActions plantingUnselectedWarningActions">
      <button id="plantingUnselectedConfirmNo" type="button" class="googleSheetConfirmCancel" data-ui-click="resolvePlantingUnselectedWarning" data-ui-boolean="false">選択へ戻る</button>
      <button id="plantingUnselectedConfirmYes" type="button" class="googleSheetConfirmSend appUpdateConfirmYes" data-ui-click="resolvePlantingUnselectedWarning" data-ui-boolean="true">このまま保存</button>
    </div>
  </div>
</div>
<div id="recordSeedlingReselectConfirmPanel" class="appUpdateConfirmOverlay">
  <div class="googleSheetConfirmPanel appUpdateConfirmWindow" role="dialog" aria-modal="true"
    aria-labelledby="recordSeedlingReselectConfirmTitle" aria-describedby="recordSeedlingReselectConfirmMessage">
    <div id="recordSeedlingReselectConfirmTitle" class="googleSheetConfirmTitle">苗植え場所の再選択</div>
    <div id="recordSeedlingReselectConfirmMessage" class="googleSheetConfirmMessage"></div>
    <div class="googleSheetConfirmActions">
      <button id="recordSeedlingReselectConfirmNo" type="button" class="googleSheetConfirmCancel"
        data-ui-click="resolveRecordSeedlingReselectConfirm" data-ui-boolean="false">選択し直さない</button>
      <button id="recordSeedlingReselectConfirmYes" type="button" class="googleSheetConfirmSend appUpdateConfirmYes"
        data-ui-click="resolveRecordSeedlingReselectConfirm" data-ui-boolean="true">選択し直す</button>
    </div>
  </div>
</div>
<div id="recordImportErrorPanel" class="recordImportErrorPanel" role="dialog" aria-modal="true" aria-labelledby="recordImportErrorTitle">
  <div id="recordImportErrorTitle" class="recordImportErrorTitle">読み込み失敗</div>
  <div id="recordImportErrorMessage" class="recordImportErrorMessage"></div>
  <button type="button" class="recordImportErrorClose" data-ui-click="hideRecordImportError">閉じる</button>
</div>
<div id="syncConflictPanel" class="appUpdateConfirmOverlay" data-ui-backdrop-click="closeSyncConflictPanel">
  <div class="syncConflictWindow" role="dialog" aria-modal="true" aria-labelledby="syncConflictTitle">
    <div class="syncConflictHeader">
      <div id="syncConflictTitle" class="syncConflictTitle">競合する記録</div>
      <button id="syncConflictCloseBtn" type="button" class="syncConflictClose" data-ui-click="closeSyncConflictPanel">閉じる</button>
    </div>
    <div class="syncConflictIntro">端末版とスプレッドシート版を両方保護しています。内容を比較して、残す方を選んでください。</div>
    <div id="syncConflictBulkActions" class="syncConflictBulkActions" hidden>
      <button id="syncConflictKeepAllLocalBtn" type="button" class="actionBtn thirdBtn" data-ui-click="resolveAllSyncConflictsWithLocalVersions">すべてこの端末の内容を残す</button>
      <div id="syncConflictBulkStatus" class="syncConflictBulkStatus" role="status" aria-live="polite" hidden></div>
    </div>
    <div id="syncConflictNavigator" class="syncConflictNavigator" hidden>
      <button id="syncConflictPreviousBtn" type="button" data-ui-click="moveSyncConflictSelection" data-ui-number="-1">前の競合</button>
      <div id="syncConflictPosition" class="syncConflictPosition">1 / 1<span class="syncConflictVersionNote">表示版: local-all-v1</span></div>
      <button id="syncConflictNextBtn" type="button" data-ui-click="moveSyncConflictSelection" data-ui-number="1">次の競合</button>
    </div>
    <div id="syncConflictList" class="syncConflictList"></div>
  </div>
</div>
