<div id="appMenuModal" class="appMenuModal" role="dialog" aria-modal="true" aria-labelledby="appMenuWindowTitle" data-ui-backdrop-click="closeAppMenuWindow">
  <div class="appMenuWindow">
    <div class="appMenuWindowHeader">
      <div id="appMenuWindowTitle" class="appMenuWindowTitle">メニュー</div>
      <button type="button" class="appMenuWindowClose" data-ui-click="closeAppMenuWindow">閉じる</button>
    </div>
    <div id="appMenuWindowBody" class="appMenuWindowBody">
      <button id="appUpdateCheckBtn" type="button" class="headerActionBtn headerLatestRefreshBtn appMenuLatestBtn availabilityNoticeTarget" data-ui-click="checkLatestAppFromMenu" aria-label="アプリの最新バージョンを確認する">
        <span class="headerLatestRefreshMain" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
            <path d="M20 6v5h-5"></path>
            <path d="M18.2 15.5A7 7 0 1 1 19.5 9"></path>
          </svg>
        </span>
        <span class="appMenuLatestCopy">
          <span class="appMenuLatestTitle">最新バージョンを確認</span>
          <span id="appUpdateCheckStatus" class="headerLatestRefreshSub"></span>
        </span>
      </button>
      <div id="dashboardStartDayMenuSetting" class="settingCluster dashboardStartDayMenuSetting">
        <div class="dashboardStartDayField">
          <label for="dashboardStartDayInput">集計の基準日</label>
          <select id="dashboardStartDayInput" class="dashboardStartDayInput" data-dashboard-start-day-input></select>
        </div>
      </div>
    </div>
    <div class="appMenuWindowFooter">
      <button type="button" class="actionBtn appMenuSaveBtn" data-ui-click="saveAppMenuSettingsAndClose">設定を保存</button>
    </div>
  </div>
</div>
<div id="forecastSettingsModal" class="forecastSettingsModal" role="dialog" aria-modal="true" aria-labelledby="forecastSettingsWindowTitle" data-ui-backdrop-click="closeForecastSettingsWindow">
  <div class="forecastSettingsWindow">
    <div class="forecastSettingsWindowHeader">
      <div id="forecastSettingsWindowTitle" class="forecastSettingsWindowTitle">計算設定</div>
      <button type="button" class="forecastSettingsWindowClose" data-ui-click="closeForecastSettingsWindow">閉じる</button>
    </div>
    <div id="forecastSettingsWindowBody" class="forecastSettingsWindowBody"></div>
    <div class="forecastSettingsWindowBody">
      <button class="actionBtn" data-ui-click="saveForecastSettingsAndClose">設定を保存</button>
    </div>
  </div>
</div>
<div id="plantingAgeModal" class="plantingAgeModal" role="dialog" aria-modal="true" aria-labelledby="plantingAgeWindowTitle" data-ui-backdrop-click="closePlantingAgeWindow">
  <div class="plantingAgeWindow">
    <div class="plantingAgeWindowHeader">
      <div id="plantingAgeWindowTitle" class="plantingAgeWindowTitle">定植日数の詳細</div>
      <button type="button" class="plantingAgeWindowClose" data-ui-click="closePlantingAgeWindow">閉じる</button>
    </div>
    <div id="plantingAgeDetail" class="plantingAgeDetail plantingAgeWindowBody">収穫場所を選択してください</div>
  </div>
</div>
<div id="seedlingHouseModal" class="recordDetailModal seedlingHouseModal" role="dialog" aria-modal="true" aria-labelledby="seedlingHouseWindowTitle" data-ui-backdrop-click="closeSeedlingHouseWindow">
  <div class="recordDetailWindow seedlingHouseWindow">
    <div class="recordDetailWindowHeader">
      <div id="seedlingHouseWindowTitle" class="recordDetailWindowTitle">1号棟 苗取り場所</div>
      <button id="seedlingHouseWindowClose" type="button" class="recordDetailWindowClose" data-ui-click="closeSeedlingHouseWindow">閉じる</button>
    </div>
    <div class="recordDetailWindowBody seedlingHouseWindowBody">
      <div id="seedlingHouseSummary" class="seedlingHouseSummary">次回開始 A-1</div>
      <div id="seedlingHousePlanNote" class="seedlingHousePlanNote">計算前は次回の苗取り開始場所だけを表示します。</div>
      <div id="seedlingHouseBeds" class="seedlingHouseBeds" aria-label="1号棟の苗取り配置図"></div>
      <div class="seedlingHouseLegend" aria-label="1号棟配置図の色分け">
        <span><i class="seedlingHouseLegendSwatch is-next"></i>次回開始</span>
        <span><i class="seedlingHouseLegendSwatch is-selected"></i>今回取る</span>
        <span><i class="seedlingHouseLegendSwatch is-skipped"></i>飛ばして残す</span>
        <span><i class="seedlingHouseLegendSwatch is-used"></i>苗取り済み</span>
      </div>
      <p class="seedlingHouseOrderNote">苗取り順：A 1→78、B 1→78、D 78→1、C 78→1、E 1→78、F 1→78</p>
    </div>
  </div>
</div>
<div id="recordDetailModal" class="recordDetailModal" role="dialog" aria-modal="true" aria-labelledby="recordDetailWindowTitle" aria-describedby="recordDetailWindowBody" data-ui-backdrop-click="closeRecordDetailWindow">
  <div class="recordDetailWindow recordDetailLocationWindow">
    <div class="recordDetailWindowHeader">
      <div id="recordDetailWindowTitle" class="recordDetailWindowTitle">記録の詳細</div>
      <button id="recordDetailWindowCloseBtn" type="button" class="recordDetailWindowClose" data-ui-click="closeRecordDetailWindow">閉じる</button>
    </div>
    <div id="recordDetailWindowBody" class="recordDetailWindowBody"></div>
  </div>
</div>
<div id="partialHarvestEditModal" class="recordDetailModal" role="dialog" aria-modal="true" aria-labelledby="partialHarvestEditWindowTitle" data-ui-backdrop-click="closePartialHarvestEditWindow">
  <div class="recordDetailWindow">
    <div class="recordDetailWindowHeader">
      <div id="partialHarvestEditWindowTitle" class="recordDetailWindowTitle">部分収穫記録を編集</div>
      <button id="partialHarvestEditWindowCloseBtn" type="button" class="recordDetailWindowClose" data-ui-click="closePartialHarvestEditWindow">閉じる</button>
    </div>
    <div class="recordDetailWindowBody partialHarvestEditWindowBody">
      <div>
        <label for="partialHarvestEditDateInput">日付</label>
        <input id="partialHarvestEditDateInput" type="date">
      </div>
      <div>
        <label for="partialHarvestEditBuildingInput">号棟</label>
        <select id="partialHarvestEditBuildingInput">
          <option value="2">2号棟</option>
          <option value="3">3号棟</option>
          <option value="4">4号棟</option>
          <option value="5">5号棟</option>
          <option value="6">6号棟</option>
          <option value="7">7号棟</option>
          <option value="8">8号棟</option>
          <option value="9">9号棟</option>
        </select>
      </div>
      <div>
        <label>ベッド</label>
        <div class="partialBedChoiceRow partialHarvestEditBedRow">
          <label class="partialBedChoice"><input type="checkbox" name="partialHarvestEditBed" value="A">A</label>
          <label class="partialBedChoice"><input type="checkbox" name="partialHarvestEditBed" value="B">B</label>
          <label class="partialBedChoice"><input type="checkbox" name="partialHarvestEditBed" value="C">C</label>
          <label class="partialBedChoice"><input type="checkbox" name="partialHarvestEditBed" value="D">D</label>
          <label class="partialBedChoice"><input type="checkbox" name="partialHarvestEditBed" value="E">E</label>
          <label class="partialBedChoice"><input type="checkbox" name="partialHarvestEditBed" value="F">F</label>
        </div>
      </div>
      <div>
        <label for="partialHarvestEditCasesInput">この場所から取れたケース数</label>
        <input id="partialHarvestEditCasesInput" type="number" min="1" step="1" inputmode="numeric">
      </div>
      <div>
        <label for="partialHarvestEditMemoInput">メモ</label>
        <textarea id="partialHarvestEditMemoInput" placeholder="気づいたことや引き継ぎを入力"></textarea>
      </div>
      <div class="partialHarvestEditActions">
        <button type="button" class="actionBtn secondaryBtn" data-ui-click="closePartialHarvestEditWindow">編集を破棄して戻る</button>
        <button type="button" class="actionBtn thirdBtn" data-ui-click="savePartialHarvestRecordEdit">変更を保存する</button>
      </div>
    </div>
  </div>
</div>
<div id="bedActionMenu" class="bedActionMenu">
  <div id="bedActionTitle" class="bedActionTitle">ベッド操作</div>
  <button type="button" data-ui-click="selectBedToNeed" data-ui-arg="front">必要数まで前から選択</button>
  <button type="button" data-ui-click="selectBedToNeed" data-ui-arg="back">必要数まで後ろから選択</button>
  <button type="button" class="clearBedAction" data-ui-click="clearSelectedBedFromMenu">このベッドを全解除</button>
  <button type="button" class="clearBedAction" data-ui-click="hideBedActionMenu">キャンセル</button>
</div>
<div id="recordBedActionMenu" class="bedActionMenu">
  <div id="recordBedActionTitle" class="bedActionTitle">実際に収穫した枚数を調整</div>
  <div class="bedActionRangeRow">
    <input id="recordBedRangeStartInput" class="bedActionInput" type="number" inputmode="numeric" min="1" max="78" placeholder="例: 1">
    <div class="bedActionRangeLabel">から</div>
    <input id="recordBedRangeEndInput" class="bedActionInput" type="number" inputmode="numeric" min="1" max="78" placeholder="例: 20">
  </div>
  <div class="bedActionHelp">指定したパレット番号の範囲を追加または削除します。</div>
  <button type="button" data-ui-click="applyRecordBedRange" data-ui-arg="add">この範囲を追加</button>
  <button type="button" class="signNegative" data-ui-click="applyRecordBedRange" data-ui-arg="remove">この範囲を削除</button>
  <button type="button" class="clearBedAction" data-ui-click="hideRecordBedActionMenu">キャンセル</button>
</div>
