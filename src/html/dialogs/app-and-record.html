<div id="appMenuModal" class="appMenuModal" role="dialog" aria-modal="true" aria-labelledby="appMenuWindowTitle">
  <div class="appMenuWindow">
    <div class="appMenuWindowHeader">
      <div id="appMenuWindowTitle" class="appMenuWindowTitle">メニュー</div>
      <button type="button" class="appMenuWindowClose" onclick="closeAppMenuWindow()">閉じる</button>
    </div>
    <div id="appMenuWindowBody" class="appMenuWindowBody">
      <button id="appUpdateCheckBtn" type="button" class="headerActionBtn headerLatestRefreshBtn appMenuLatestBtn availabilityNoticeTarget" onclick="checkLatestAppFromMenu()" aria-label="アプリの最新バージョンを確認する">
        <span class="headerLatestRefreshMain" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
            <path d="M20 6v5h-5"></path>
            <path d="M18.2 15.5A7 7 0 1 1 19.5 9"></path>
          </svg>
        </span>
        <span class="appMenuLatestCopy">
          <span class="appMenuLatestTitle">最新バージョンを確認</span>
          <span id="appUpdateCheckStatus" class="headerLatestRefreshSub"></span>
        </span>
      </button>
    </div>
    <div class="appMenuWindowFooter">
      <button type="button" class="actionBtn appMenuSaveBtn" onclick="saveAppMenuSettingsAndClose()">設定を保存</button>
    </div>
  </div>
</div>
<div id="forecastSettingsModal" class="forecastSettingsModal" role="dialog" aria-modal="true" aria-labelledby="forecastSettingsWindowTitle">
  <div class="forecastSettingsWindow">
    <div class="forecastSettingsWindowHeader">
      <div id="forecastSettingsWindowTitle" class="forecastSettingsWindowTitle">計算設定</div>
      <button type="button" class="forecastSettingsWindowClose" onclick="closeForecastSettingsWindow()">閉じる</button>
    </div>
    <div id="forecastSettingsWindowBody" class="forecastSettingsWindowBody"></div>
    <div class="forecastSettingsWindowBody">
      <button class="actionBtn" onclick="saveForecastSettingsAndClose()">設定を保存</button>
    </div>
  </div>
</div>
<div id="plantingAgeModal" class="plantingAgeModal" role="dialog" aria-modal="true" aria-labelledby="plantingAgeWindowTitle">
  <div class="plantingAgeWindow">
    <div class="plantingAgeWindowHeader">
      <div id="plantingAgeWindowTitle" class="plantingAgeWindowTitle">定植日数の詳細</div>
      <button type="button" class="plantingAgeWindowClose" onclick="closePlantingAgeWindow()">閉じる</button>
    </div>
    <div id="plantingAgeDetail" class="plantingAgeDetail plantingAgeWindowBody">収穫場所を選択してください</div>
  </div>
</div>
<div id="recordDetailModal" class="recordDetailModal" role="dialog" aria-modal="true" aria-labelledby="recordDetailWindowTitle" aria-describedby="recordDetailWindowBody">
  <div class="recordDetailWindow recordDetailLocationWindow">
    <div class="recordDetailWindowHeader">
      <div id="recordDetailWindowTitle" class="recordDetailWindowTitle">記録の詳細</div>
      <button id="recordDetailWindowCloseBtn" type="button" class="recordDetailWindowClose" onclick="closeRecordDetailWindow()">閉じる</button>
    </div>
    <div id="recordDetailWindowBody" class="recordDetailWindowBody"></div>
  </div>
</div>
<div id="partialHarvestEditModal" class="recordDetailModal" role="dialog" aria-modal="true" aria-labelledby="partialHarvestEditWindowTitle">
  <div class="recordDetailWindow">
    <div class="recordDetailWindowHeader">
      <div id="partialHarvestEditWindowTitle" class="recordDetailWindowTitle">部分収穫記録を編集</div>
      <button id="partialHarvestEditWindowCloseBtn" type="button" class="recordDetailWindowClose" onclick="closePartialHarvestEditWindow()">閉じる</button>
    </div>
    <div class="recordDetailWindowBody partialHarvestEditWindowBody">
      <div>
        <label for="partialHarvestEditDateInput">日付</label>
        <input id="partialHarvestEditDateInput" type="date">
      </div>
      <div>
        <label for="partialHarvestEditBuildingInput">号棟</label>
        <select id="partialHarvestEditBuildingInput">
          <option value="2">2号棟</option>
          <option value="3">3号棟</option>
          <option value="4">4号棟</option>
          <option value="5">5号棟</option>
          <option value="6">6号棟</option>
          <option value="7">7号棟</option>
          <option value="8">8号棟</option>
          <option value="9">9号棟</option>
        </select>
      </div>
      <div>
        <label>ベッド</label>
        <div class="partialBedChoiceRow partialHarvestEditBedRow">
          <label class="partialBedChoice"><input type="checkbox" name="partialHarvestEditBed" value="A">A</label>
          <label class="partialBedChoice"><input type="checkbox" name="partialHarvestEditBed" value="B">B</label>
          <label class="partialBedChoice"><input type="checkbox" name="partialHarvestEditBed" value="C">C</label>
          <label class="partialBedChoice"><input type="checkbox" name="partialHarvestEditBed" value="D">D</label>
          <label class="partialBedChoice"><input type="checkbox" name="partialHarvestEditBed" value="E">E</label>
          <label class="partialBedChoice"><input type="checkbox" name="partialHarvestEditBed" value="F">F</label>
        </div>
      </div>
      <div>
        <label for="partialHarvestEditCasesInput">この場所から取れたケース数</label>
        <input id="partialHarvestEditCasesInput" type="number" min="1" step="1" inputmode="numeric">
      </div>
      <div>
        <label for="partialHarvestEditMemoInput">メモ</label>
        <textarea id="partialHarvestEditMemoInput" placeholder="気づいたことや引き継ぎを入力"></textarea>
      </div>
      <div class="partialHarvestEditActions">
        <button type="button" class="actionBtn secondaryBtn" onclick="closePartialHarvestEditWindow()">編集を破棄して戻る</button>
        <button type="button" class="actionBtn thirdBtn" onclick="savePartialHarvestRecordEdit()">変更を保存する</button>
      </div>
    </div>
  </div>
</div>
<div id="bedActionMenu" class="bedActionMenu">
  <div id="bedActionTitle" class="bedActionTitle">ベッド操作</div>
  <button type="button" onclick="selectBedToNeed('front')">必要数まで前から選択</button>
  <button type="button" onclick="selectBedToNeed('back')">必要数まで後ろから選択</button>
  <button type="button" class="clearBedAction" onclick="clearSelectedBedFromMenu()">このベッドを全解除</button>
  <button type="button" class="clearBedAction" onclick="hideBedActionMenu()">キャンセル</button>
</div>
<div id="recordBedActionMenu" class="bedActionMenu">
  <div id="recordBedActionTitle" class="bedActionTitle">実際に収穫した枚数を調整</div>
  <div class="bedActionRangeRow">
    <input id="recordBedRangeStartInput" class="bedActionInput" type="number" inputmode="numeric" min="1" max="78" placeholder="例: 1">
    <div class="bedActionRangeLabel">から</div>
    <input id="recordBedRangeEndInput" class="bedActionInput" type="number" inputmode="numeric" min="1" max="78" placeholder="例: 20">
  </div>
  <div class="bedActionHelp">指定したパレット番号の範囲を追加または削除します。</div>
  <button type="button" onclick="applyRecordBedRange('add')">この範囲を追加</button>
  <button type="button" class="signNegative" onclick="applyRecordBedRange('remove')">この範囲を削除</button>
  <button type="button" class="clearBedAction" onclick="hideRecordBedActionMenu()">キャンセル</button>
</div>
