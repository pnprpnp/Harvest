<div id="monitorModeOverlay" class="monitorModeOverlay">
  <div class="monitorModeShell">
    <div class="monitorModeHeader">
      <button type="button" class="monitorModeClose" data-ui-click="closeMonitorMode">閉じる</button>
    </div>
    <div id="monitorModeViewport" class="monitorModeViewport">
      <div id="monitorModeBody" class="monitorModeBody" aria-live="polite"></div>
    </div>
  </div>
</div>
<div id="monitorPreviewModal" class="monitorEditorModal" role="dialog" aria-modal="true" aria-labelledby="monitorPreviewTitle" data-ui-backdrop-click="resolveMonitorPreview" data-ui-boolean="false">
  <div class="monitorPreviewWindow">
    <div class="monitorEditorWindowHeader">
      <div id="monitorPreviewTitle" class="monitorEditorWindowTitle">プレビュー</div>
    </div>
    <div class="monitorPreviewBodyWrap">
      <p class="monitorPreviewNote">このようにモニターに表示されます</p>
      <div id="monitorPreviewViewport" class="monitorPreviewViewport">
        <div id="monitorPreviewBody" class="monitorModeBody"></div>
      </div>
      <div class="monitorPreviewActions">
        <button type="button" class="monitorPreviewCancelBtn" data-ui-click="resolveMonitorPreview" data-ui-boolean="false">キャンセル</button>
        <button type="button" class="monitorPreviewOkBtn" data-ui-click="resolveMonitorPreview" data-ui-boolean="true">OK</button>
      </div>
    </div>
  </div>
</div>
<div id="monitorEditorModal" class="monitorEditorModal" role="dialog" aria-modal="true" aria-labelledby="monitorEditorWindowTitle" data-ui-backdrop-click="closeMonitorEditorWindow">
  <div class="monitorEditorWindow">
    <div class="monitorEditorWindowHeader">
      <div id="monitorEditorWindowTitle" class="monitorEditorWindowTitle">今回送る内容を編集</div>
      <button type="button" class="monitorEditorCloseBtn" data-ui-click="closeMonitorEditorWindow">閉じる</button>
    </div>
    <div id="monitorEditorModalBody" class="monitorEditorWindowBody"></div>
  </div>
</div>
<div id="monitorEditorStorage" style="display:none;">
  <div id="monitorRemoteEditorContent" class="settingClusterDetailsBody">
    <label for="monitorRemoteSeedlingValueInput">苗枚数</label>
    <textarea id="monitorRemoteSeedlingValueInput" rows="2" placeholder="例: 3枚"></textarea>
    <label for="monitorRemoteCasesValueInput">収穫ケース数</label>
    <textarea id="monitorRemoteCasesValueInput" rows="2" placeholder="例: 120ケース"></textarea>
    <label for="monitorRemoteHarvestLocationValueInput">収穫場所</label>
    <textarea id="monitorRemoteHarvestLocationValueInput" rows="3" placeholder="例: 2号棟 A 後ろ3ピンとる"></textarea>
    <label for="monitorRemoteRemainingCasesValueInput">残すケース</label>
    <textarea id="monitorRemoteRemainingCasesValueInput" rows="3" placeholder="例: 手前 10ケース"></textarea>
    <div class="monitorMemoInputHeader">
      <div class="monitorMemoInputTitle">表示するメモ</div>
      <button type="button" class="monitorMemoAddBtn" data-ui-click="addMonitorRemoteMemoInput">＋追加</button>
    </div>
    <div id="monitorRemoteMemoInputList" class="monitorMemoInputList"></div>
    <div id="monitorRemoteEditorStatus" class="smallText monitorContentEditorStatus" hidden></div>
    <div class="monitorContentEditorActions">
      <button class="actionBtn secondaryBtn monitorContentEditorDiscardBtn" data-ui-click="discardMonitorCurrentEditor">編集を破棄</button>
      <button class="actionBtn thirdBtn monitorContentEditorApplyBtn" data-ui-click="applyMonitorCurrentEditor">変更を反映</button>
    </div>
  </div>
</div>
