  <div id="forecastTab">
    <div id="forecastSimulationCard" class="card tabLinkedCard workflowFocusHeading" aria-label="シミュレーション">
      <div class="forecastControlRow">
        <div class="forecastCaseField">
          <div class="forecastFieldHeader">
            <span class="forecastCaseIcon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M12 2.7 21 7.4v9.2L12 21.3 3 16.6V7.4L12 2.7Z"></path>
                <path d="m3.8 7.8 8.2 4.3 8.2-4.3M12 12.1v8.2"></path>
                <path d="m8 5 8.2 4.3"></path>
              </svg>
            </span>
            <div class="forecastFieldLabelStack">
              <label id="forecastCasesLabel" class="fieldAccentLabel" for="casesInput">収穫ケース数</label>
              <div id="partialHarvestDeductionNote" class="partialHarvestDeductionNote" aria-live="polite" hidden></div>
            </div>
          </div>
          <div class="forecastCaseInputPanel">
            <span class="inputUnitWrap forecastCaseUnitWrap">
              <input id="casesInput" type="number" min="0" step="1" value="" inputmode="numeric" aria-label="収穫ケース数" data-ui-input="handleHarvestCasesInputChange">
              <span class="inputUnitSuffix">ケース</span>
            </span>
          </div>
        </div>
      </div>

      <div class="casePlacementDivider"></div>

      <div id="forecastResultActions" class="forecastResultActions forecastBottomClearRow" hidden>
        <button id="seedlingHouseOpenBtn" type="button" class="seedlingHouseOpenBtn" data-ui-click="openSeedlingHouseWindow" aria-label="苗取り場所の1号棟を開く" aria-haspopup="dialog" aria-controls="seedlingHouseModal">
          <span class="seedlingHouseOpenIcon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false">
              <path d="M12 21V10"></path>
              <path d="M12 14c-4.5 0-7-2.2-7-6 4.5 0 7 2.2 7 6Z"></path>
              <path d="M12 10c0-4 2.4-6 7-6 0 4-2.4 6-7 6Z"></path>
            </svg>
          </span>
          <span class="seedlingHouseOpenBuilding">1号棟</span>
        </button>
        <button id="harvestProgressOpenBtn" type="button" class="harvestProgressOpenBtn" data-ui-click="toggleHarvestProgressInput" aria-expanded="false" aria-haspopup="dialog" aria-controls="harvestProgressModal">途中経過を入力</button>
        <button class="actionBtn secondaryBtn forecastClearBtn" data-ui-click="clearHarvestPrediction">クリア</button>
      </div>

      <div class="casePlacementPanel">
        <div class="casePlacementHeader">
          <div class="buildingSwitch simulationBuildingPagination casePlacementBuildingSwitch">
            <button type="button" class="buildingBtn" data-ui-click="prevCasePlacementBuilding" aria-label="前の号棟">
              <span class="buildingPaginationChevron" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg></span>
            </button>
            <div id="casePlacementBuildingPager" class="simulationBuildingPager casePlacementBuildingPager" role="group" aria-label="号棟切り替え。左右にスワイプできます">
              <button id="casePlacementBuildingBtn" type="button" class="buildingBtn active" aria-live="polite" tabindex="-1"><span class="buildingPaginationLabel">2号棟</span></button>
            </div>
            <button type="button" class="buildingBtn" data-ui-click="nextCasePlacementBuilding" aria-label="次の号棟">
              <span class="buildingPaginationChevron" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"></path></svg></span>
            </button>
          </div>
        </div>
        <div id="forecastPlacementStatusCard" class="forecastPlacementStatusCard" aria-label="号棟の定植日数、ケース配置、収穫可能ケース数">
          <button id="forecastPlantingAgeResult" type="button" class="forecastPlantingAgeResult" data-ui-click="openPlantingAgeWindow" aria-labelledby="forecastPlantingAgeResultTitle" aria-haspopup="dialog" aria-controls="plantingAgeModal" hidden>
            <div id="forecastPlantingAgeResultTitle" class="forecastPlantingAgeResultTitle">定植日数の詳細</div>
            <div class="forecastPlantingAgeValueRow">
              <span id="forecastPlantingAgeRange" class="forecastPlantingAgeRange">未選択</span>
            </div>
          </button>
          <button id="casePlacementSummaryButton" type="button" class="casePlacementDetailsSummary" data-ui-click="toggleCasePlacementDetails" aria-expanded="false" aria-controls="casePlacementDetails">
            <span class="casePlacementDetailsHeading">
              <span class="casePlacementDetailsIcon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" focusable="false">
                  <rect x="3" y="3" width="18" height="8" rx="2"></rect>
                  <rect x="3" y="13" width="18" height="8" rx="2"></rect>
                </svg>
              </span>
              <span class="casePlacementDetailsLabel">ケース配置</span>
            </span>
            <span id="casePlacementCompactSummary" class="casePlacementCompactSummary">0ケース</span>
          </button>
          <div id="remainingCasesSummaryCard" class="casePlacementRemainingSummary" aria-label="選択中の号棟の収穫可能ケース数">
            <span class="casePlacementRemainingLabel">収穫可能</span>
            <span id="remainingCasesSummary" class="casePlacementRemainingValue">0ケース</span>
          </div>
        </div>
        <details id="casePlacementDetails" class="casePlacementDetails" data-ui-toggle="syncCasePlacementDetailsToggle">
          <summary class="casePlacementNativeSummary">ケース配置の入力欄</summary>
          <div class="casePlacementDetailsBody">
            <div class="casePlacementDetailsToolbar">
              <button type="button" class="casePlacementDefaultBtn" data-ui-click="setDefaultCasePlacement">標準配置</button>
            </div>
            <div class="casePlacementGrid">
              <div class="casePlacementItem">
                <label>奥</label>
                <span class="inputUnitWrap casePlacementUnitWrap">
                  <input id="backCaseInput" type="number" min="0" value="" inputmode="numeric" data-ui-input="handleCasePlacementInput">
                  <span class="inputUnitSuffix">ケース</span>
                </span>
              </div>
              <div class="casePlacementItem">
                <label>中央</label>
                <span class="inputUnitWrap casePlacementUnitWrap">
                  <input id="middleCaseInput" type="number" min="0" value="" inputmode="numeric" data-ui-input="handleCasePlacementInput">
                  <span class="inputUnitSuffix">ケース</span>
                </span>
              </div>
              <div class="casePlacementItem">
                <label>手前</label>
                <span class="inputUnitWrap casePlacementUnitWrap">
                  <input id="frontCaseInput" type="number" min="0" value="" inputmode="numeric" data-ui-input="handleCasePlacementInput">
                  <span class="inputUnitSuffix">ケース</span>
                </span>
              </div>
              <div class="casePlacementTotal">
                <div class="casePlacementTotalLabelWrap">
                  <button type="button" class="casePlacementClearInlineBtn" data-ui-click="clearCasePlacement" aria-label="この号棟のケース配置を消す">消す</button>
                  <div class="casePlacementTotalLabel">合計</div>
                </div>
                <div class="casePlacementTotalDisplay">
                  <span id="casePlacementTotalValue" class="casePlacementTotalValue">0</span>
                  <span class="inputUnitSuffix">ケース</span>
                </div>
              </div>
            </div>
          </div>
        </details>
        <div class="casePlacementBedPanel">
          <div id="beds" class="bedWrap"></div>
        </div>
        <div class="simulationBedMapLegend" aria-label="ベッド配置図の色分け">
          <span class="simulationBedMapLegendItem"><span class="simulationBedMapLegendSwatch is-selected"></span>選択中</span>
          <span class="simulationBedMapLegendItem"><span class="simulationBedMapLegendSwatch is-overage"></span>超過分</span>
          <span class="simulationBedMapLegendItem"><span class="simulationBedMapLegendSwatch is-recorded"></span>記録済み</span>
          <span class="simulationBedMapLegendItem"><span class="simulationBedMapLegendSwatch is-replanted"></span>定植済み</span>
          <span class="simulationBedMapLegendItem"><span class="simulationBedMapLegendSwatch is-progress-completed"></span>途中経過完了</span>
          <span class="simulationBedMapLegendItem"><span class="simulationBedMapLegendSwatch is-partial-harvest"></span>部分収穫</span>
        </div>
        <div class="bedDetailOpenHint">ベッドを長押しすると拡大し、パレットを選択できます</div>
        <div class="forecastActionRow" role="group" aria-label="シミュレーション操作">
          <div class="forecastActionBarInner">
            <button type="button" class="forecastSettingsOpenBtn" data-ui-click="openForecastSettingsWindow" aria-label="計算設定を開く">
              <span class="forecastSettingsOpenIcon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" focusable="false">
                  <path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h7M15 18h5"></path>
                  <circle cx="16" cy="6" r="2"></circle>
                  <circle cx="8" cy="12" r="2"></circle>
                  <circle cx="13" cy="18" r="2"></circle>
                </svg>
              </span>
              <span id="forecastSettingsSummary" class="forecastSettingsSummary">ロス 0%・20 / 20 / 60(0/3)</span>
            </button>
            <button id="harvestCalculateBtn" class="actionBtn casePlacementCalculateBtn" data-ui-click="runHarvestPrediction">計算</button>
          </div>
        </div>
      </div>

      <details class="forecastSummaryCard" hidden>
        <summary class="sectionTitle forecastSummaryTitle">選択結果</summary>
        <div id="forecastSummary" class="resultBox">開始パレット: -
選択枚数: 0
終了パレット: -</div>
      </details>
    </div>

  </div>
