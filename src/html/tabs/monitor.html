<div class="container">
  <div id="monitorTab" style="display:none;">
    <div id="monitorCard" class="card tabLinkedCard workflowFocusHeading" aria-label="モニター">
      <div class="monitorTabHeader">
        <div class="monitorSendState" aria-live="polite">
          <span id="monitorSendStatusBadge" class="monitorSendStatusBadge is-unready">計算前</span>
          <span id="monitorLastSentAt" class="monitorLastSentAt">最終送信 --</span>
        </div>
        <button type="button" class="headerActionBtn monitorOpenBtn" data-ui-click="openMonitorMode">モニターを開く</button>
      </div>
      <section class="monitorSendContentCard" aria-labelledby="monitorSendContentTitle">
        <div class="monitorSendContentTitle">
          <span id="monitorSendContentTitle">今回送る内容</span>
          <button type="button" class="monitorContentEditBtn" data-ui-click="openMonitorEditorWindow">編集</button>
        </div>
        <div id="instructionSummary" class="resultBox instructionBox">苗: 0枚
収穫ケース数: 0
収穫場所: -
配置コンテナ数:
なし
残すケース数:
なし</div>
        <div class="monitorMemoReadOnlyRow">
          <span class="monitorSendSummaryLabel">
            <svg class="monitorSendSummaryIcon" viewBox="0 0 20 20" aria-hidden="true">
              <path d="M4.5 4.5h11v8h-6l-3.5 3v-3H4.5z"></path>
              <path d="M7 7h6M7 9.7h4"></path>
            </svg>
            <span>表示メモ</span>
          </span>
          <div id="monitorMemoReadOnlyValue" class="monitorMemoReadOnlyValue">なし</div>
        </div>
      </section>
      <div id="monitorMemoInputPanel" class="monitorMemoInputPanel monitorMemoInputStorage" hidden aria-hidden="true">
        <div id="monitorMemoInputList" class="monitorMemoInputList"></div>
      </div>
      <div class="monitorSendActionBar">
        <button id="monitorSaveBtn" type="button" class="actionBtn monitorSaveBtn" data-ui-click="saveCurrentMonitorRemoteContent" aria-label="プレビューして送信する">
          <span class="monitorSaveSpinner" aria-hidden="true"></span>
          <span id="monitorSaveBtnLabel" class="monitorSaveBtnLabel" aria-live="polite">プレビューして送信</span>
        </button>
      </div>
    </div>
  </div>
