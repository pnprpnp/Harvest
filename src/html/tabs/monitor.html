<div class="container">
  <div id="monitorTab" style="display:none;">
    <div id="monitorCard" class="card tabLinkedCard">
      <div class="sectionTitleRow">
        <h2 id="monitorSectionTitle" class="sectionTitle workflowFocusHeading">モニター</h2>
        <div class="sectionTitleActions">
          <button type="button" class="headerActionBtn" onclick="openMonitorMode()">モニター表示</button>
          <button type="button" class="headerActionBtn" onclick="openMonitorEditorWindow()">モニター編集</button>
        </div>
      </div>
      <div id="instructionSummary" class="resultBox instructionBox">苗: 0枚
収穫ケース数: 0
収穫場所: -
残すケース:
なし</div>
      <div class="monitorMemoInputHeader">
        <div class="monitorMemoInputTitle">表示したいメモ</div>
        <button type="button" class="monitorMemoAddBtn" onclick="addMonitorMemoInput()">＋</button>
      </div>
      <div id="monitorMemoInputList" class="monitorMemoInputList"></div>
      <button id="monitorSaveBtn" type="button" class="actionBtn monitorSaveBtn" onclick="saveCurrentMonitorRemoteContent()" aria-label="送信してモニターに表示する">
        <span class="monitorSaveSpinner" aria-hidden="true"></span>
        <span id="monitorSaveBtnLabel" class="monitorSaveBtnLabel" aria-live="polite">送信してモニターに表示する</span>
      </button>
    </div>
  </div>
