<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>選択肢の動き・実画面プレビュー</title>
<style>
  :root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#1f2937;background:#eef1f4;}
  body{margin:0;padding:16px;}
  .controls{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .controls button{padding:8px 16px;border:1px solid #b6bec8;border-radius:9px;background:white;color:inherit;font:inherit;cursor:pointer;}
  .controls button[aria-pressed="true"]{border-color:#248a4b;background:#e8f6ec;color:#186534;font-weight:700;}
  .frame{display:block;height:min(780px,calc(100dvh - 84px));margin:auto;border:1px solid #b6bec8;border-radius:14px;background:white;box-shadow:0 8px 28px #1f293725;}
  p{text-align:center;font-size:13px;}
</style>
</head>
<body>
<div class="controls">
  <button type="button" data-width="320" aria-pressed="false">320px</button>
  <button type="button" data-width="390" aria-pressed="true">390px</button>
</div>
<iframe class="frame" title="Harvestnavi 実画面" src="../index.html" width="390"></iframe>
<p>画面内の選択欄を押すと、変更したメニューを操作できます。</p>
<script>
  const frame = document.querySelector("iframe");
  document.querySelectorAll("[data-width]").forEach(button => button.addEventListener("click", () => {
    frame.width = button.dataset.width;
    document.querySelectorAll("[data-width]").forEach(item => item.setAttribute("aria-pressed", String(item === button)));
  }));
</script>
</body>
</html>
