<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>生育予測β・実画面プレビュー</title>
  <style>
    :root{
      color-scheme:light;
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif;
      background:#edf1ee;
      color:#243029;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:#edf1ee;}
    button{font:inherit;}
    .previewPage{
      min-height:100dvh;
      display:grid;
      justify-items:center;
      align-content:start;
      gap:10px;
      padding:12px;
    }
    .previewControls{
      width:min(100%,393px);
      display:grid;
      gap:7px;
      padding:8px;
      border:1px solid #d6dfd9;
      border-radius:12px;
      background:#fff;
      box-shadow:0 4px 16px rgba(29,64,40,.08);
    }
    .previewControlRow{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      align-items:center;
      gap:8px;
    }
    .previewLabel{padding-left:4px;font-size:12px;font-weight:800;line-height:1.35;}
    .previewLabel small{display:block;color:#758179;font-size:9px;font-weight:650;}
    .previewSwitch{
      display:grid;
      grid-auto-flow:column;
      grid-auto-columns:1fr;
      gap:2px;
      padding:2px;
      border-radius:9px;
      background:#e8eeea;
    }
    .previewSwitch button{
      min-height:31px;
      padding:4px 9px;
      border:0;
      border-radius:7px;
      background:transparent;
      color:#68746c;
      font-size:10px;
      font-weight:800;
      white-space:nowrap;
    }
    .previewSwitch button[aria-pressed="true"]{
      background:#fff;
      color:#137847;
      box-shadow:0 1px 4px rgba(31,65,42,.12);
    }
    .appViewport{
      position:relative;
      width:min(var(--preview-width,390px),calc(100vw - 24px));
      height:852px;
      overflow:hidden;
      border:1px solid #d2dad5;
      border-radius:24px;
      background:#f7f7f9;
      box-shadow:0 18px 48px rgba(25,53,35,.16);
      transition:width .16s ease;
    }
    .appViewport iframe{display:block;width:100%;height:852px;border:0;background:#f7f7f9;}
    .previewStatus{
      position:absolute;
      inset:0;
      z-index:2;
      display:grid;
      place-items:center;
      padding:24px;
      background:#f7f7f9;
      color:#66736b;
      font-size:13px;
      font-weight:700;
      text-align:center;
    }
    .previewStatus[hidden]{display:none;}
    @media(max-width:416px){
      .previewPage{padding:8px 0 0;}
      .previewControls{width:calc(100% - 16px);}
      .appViewport{
        max-width:100vw;
        border-right:0;
        border-bottom:0;
        border-left:0;
        border-radius:0;
        box-shadow:none;
      }
    }
  </style>
</head>
<body>
  <main class="previewPage">
    <section class="previewControls" aria-label="生育予測β版のプレビュー設定">
      <div class="previewControlRow">
        <div class="previewLabel">表示内容<small>実際のアプリ画面を使用</small></div>
        <div class="previewSwitch" role="group" aria-label="表示内容">
          <button type="button" data-preview-view="growth" aria-pressed="true">生育予測</button>
          <button type="button" data-preview-view="menu" aria-pressed="false">メニュー</button>
          <button type="button" data-preview-view="record" aria-pressed="false">収穫記録</button>
        </div>
      </div>
      <div class="previewControlRow">
        <div class="previewLabel">表示幅<small>スマートフォンでの収まりを確認</small></div>
        <div class="previewSwitch" role="group" aria-label="画面幅">
          <button type="button" data-preview-width="320" aria-pressed="false">320px</button>
          <button type="button" data-preview-width="390" aria-pressed="true">390px</button>
        </div>
      </div>
    </section>

    <section id="appViewport" class="appViewport" aria-label="Harvestnavi 生育予測β版の実画面プレビュー">
      <iframe id="appFrame" title="Harvestnavi 生育予測β版"></iframe>
      <div id="previewStatus" class="previewStatus" role="status">実際のアプリ画面を準備しています…</div>
    </section>
  </main>

  <script>
    const appFrame = document.getElementById("appFrame");
    const appViewport = document.getElementById("appViewport");
    const previewStatus = document.getElementById("previewStatus");
    const viewButtons = [...document.querySelectorAll("[data-preview-view]")];
    const widthButtons = [...document.querySelectorAll("[data-preview-width]")];
    let previewReady = false;
    const originalLocalStorage = Object.fromEntries(
      Array.from({ length:localStorage.length }, (_, index) => localStorage.key(index))
        .filter(Boolean)
        .map(key => [key, localStorage.getItem(key)])
    );
    const originalSessionStorage = Object.fromEntries(
      Array.from({ length:sessionStorage.length }, (_, index) => sessionStorage.key(index))
        .filter(Boolean)
        .map(key => [key, sessionStorage.getItem(key)])
    );

    function restoreOriginalStorage(){
      localStorage.clear();
      Object.entries(originalLocalStorage).forEach(([key, value]) => localStorage.setItem(key, value));
      sessionStorage.clear();
      Object.entries(originalSessionStorage).forEach(([key, value]) => sessionStorage.setItem(key, value));
    }

    function setPreviewStorage(){
      localStorage.clear();
      sessionStorage.clear();
      localStorage.setItem("harvestnaviThemePreference_v1", "light");
      localStorage.setItem("harvestnaviWorkflowTitleHintShown_v1", "1");
      localStorage.setItem("harvestnaviAppAccessRole_v1", "admin");
      localStorage.setItem("harvestForecastProtectedAccessAuth_v1", "1");
    }

    function showGrowthPreview(){
      const app = appFrame.contentWindow;
      return app.eval(`(() => {
        closeAppMenuWindow();
        appAccessRole = APP_ACCESS_ROLE_ADMIN;
        protectedAccessUnlocked = true;
        applyAppAccessRoleUi();
        document.getElementById("welcomeScreen")?.remove();
        switchTab("dashboard");
        cancelDashboardRenderAfterTabSelection();
        dashboardFilter.dashboardSubtab = "growth";
        syncDashboardSubtabUi();

        const today = startOfLocalDay(new Date());
        const makeRange = (startDays, endDays = startDays) => ({
          start:{ date:addDays(today, startDays), daysAfter:startDays },
          end:{ date:addDays(today, endDays), daysAfter:endDays }
        });
        const presets = {
          A:{ range:makeRange(5), status:"normal", statusLabel:"ちょうど良い見込み", risk:{ tipburn:{level:"low",label:"低め"}, elongated:{level:"low",label:"低め"} }, reason:"過去の収穫時に近い生育条件", confidence:"中", provisional:false },
          B:{ range:makeRange(6, 7), status:"small", statusLabel:"やや小さめの可能性", risk:{ tipburn:{level:"watch",label:"やや注意"}, elongated:{level:"low",label:"低め"} }, reason:"過去の収穫時より積算した気温・日射が少ない見込み", confidence:"低め", provisional:false },
          C:{ range:makeRange(10), status:"large", statusLabel:"大きめの可能性", risk:{ tipburn:{level:"alert",label:"注意"}, elongated:{level:"low",label:"低め"} }, reason:"過去の収穫時より生育条件が先行する見込み。高温になりやすい号棟としてβ補正", confidence:"中", provisional:false },
          D:{ range:makeRange(18, 20), status:"normal", statusLabel:"ちょうど良い見込み", risk:{ tipburn:{level:"low",label:"低め"}, elongated:{level:"alert",label:"注意"} }, reason:"長期部分は過去の同時期平均を使用", confidence:"低め", provisional:true },
          E:{ range:null, status:"unknown", statusLabel:"予定なし", risk:{} },
          F:{ range:makeRange(13), status:"unknown", statusLabel:"判定材料不足", risk:{ tipburn:{level:"unknown",label:"判定待ち"}, elongated:{level:"unknown",label:"判定待ち"} }, reason:"育ち具合の評価記録が増えると判定できます", confidence:"低め", provisional:true }
        };
        const predictions = new Map();
        BUILDINGS.forEach(building => bedOrder.forEach(bed => {
          const preset = building === 2 ? presets[bed] : { range:null, status:"unknown", statusLabel:"予定なし", risk:{} };
          predictions.set(building + "-" + bed, { building, bed, ...preset });
        }));
        const samples = Array.from({ length:7 }, (_, index) => ({
          building:2,
          bed:bedOrder[index % bedOrder.length],
          sizeRating:index === 1 ? "small" : (index === 5 ? "large" : "normal"),
          units:30 + index,
          ageDays:36 + index,
          tipburn:index === 2,
          elongated:false
        }));
        const model = {
          predictions,
          samples,
          startBuilding:2,
          weather:{ fetchedAt:Date.now(), stale:false, provider:"jma", forecastEndDate:formatDateOnlyString(addDays(today, 6)), normal:{ minTemp:18, maxTemp:28, meanTemp:23, lightIndex:.85 }, daily:[] },
          performance:{ fetchMs:820, computeMs:4, weatherDays:816 }
        };
        dashboardGrowthPredictionBuilding = 2;
        dashboardGrowthPredictionModelCache = model;
        dashboardRenderedSubtabs.add("growth");
        renderDashboardGrowthPredictionModel(model, {
          officeCode:"430000",
          forecastAreaCode:"430010",
          class20Code:"4320211",
          name:"八代市西部",
          admin1:"熊本県",
          forecastAreaName:"熊本地方"
        });
        document.getElementById("dashboardLoadingState").hidden = true;
        window.scrollTo(0, 0);
        return document.querySelectorAll(".dashboardGrowthBedCard").length;
      })()`);
    }

    function showRecordPreview(){
      const app = appFrame.contentWindow;
      return app.eval(`(() => {
        closeAppMenuWindow();
        document.getElementById("welcomeScreen")?.remove();
        switchTab("record");
        recordSelectionMode = "harvest";
        recordViewMode = "entry";
        recordHarvestStage = "quality";
        recordHarvestPrimaryInputsExpanded = false;
        harvestFillKeys = [
          ...Array.from({length:12}, (_, index) => getPalletKey(2, "A", index + 1)),
          ...Array.from({length:10}, (_, index) => getPalletKey(2, "B", index + 1))
        ];
        document.getElementById("recordDateInput").value = formatDateOnlyString(new Date());
        document.getElementById("recordCasesInput").value = "36";
        document.getElementById("recordPalletSummaryInput").value = formatPalletSummary(harvestFillKeys);
        setSelectedQualityMemo({ tags:["elongated"], other:"" });
        setSelectedHarvestGrowthAssessment({
          palletKeys:harvestFillKeys,
          qualityMemo:{ tags:["elongated"], other:"" },
          sizeRating:"normal",
          growthDetail:{
            uneven:true,
            bedOverrides:{
              "2-B":{ sizeRating:"small", uneven:true, tipburn:true, elongated:false }
            }
          }
        });
        refreshRecordModeUi();
        openRecordHarvestStage("quality");
        const editor = document.getElementById("recordHarvestGrowthBedEditor");
        if(editor?.hidden) toggleRecordHarvestGrowthBedEditor();
        document.getElementById("recordSaveCard")?.scrollIntoView({ block:"start" });
        return document.querySelectorAll(".recordHarvestGrowthBedRow").length;
      })()`);
    }

    function showMenuPreview(){
      const app = appFrame.contentWindow;
      return app.eval(`(() => {
        document.getElementById("welcomeScreen")?.remove();
        saveDashboardGrowthLocation({
          officeCode:"430000",
          forecastAreaCode:"430010",
          class20Code:"4320211",
          name:"八代市西部",
          admin1:"熊本県",
          forecastAreaName:"熊本地方"
        });
        openAppMenuWindow();
        const input = document.getElementById("dashboardGrowthLocationInput");
        if(input) input.value = "八代市";
        return document.getElementById("appMenuModal")?.classList.contains("show");
      })()`);
    }

    function setPreviewView(view){
      if(!previewReady) return;
      const result = view === "record"
        ? showRecordPreview()
        : (view === "menu" ? showMenuPreview() : showGrowthPreview());
      if(!result) throw new Error("プレビュー表示を作成できませんでした");
      viewButtons.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.previewView === view)));
    }

    viewButtons.forEach(button => button.addEventListener("click", () => setPreviewView(button.dataset.previewView)));
    widthButtons.forEach(button => {
      button.addEventListener("click", () => {
        appViewport.style.setProperty("--preview-width", button.dataset.previewWidth === "320" ? "320px" : "390px");
        widthButtons.forEach(item => item.setAttribute("aria-pressed", String(item === button)));
      });
    });

    appFrame.addEventListener("load", () => {
      try{
        previewReady = true;
        if(showGrowthPreview() < 6) throw new Error("生育予測のカードを作成できませんでした");
        requestAnimationFrame(() => requestAnimationFrame(() => { previewStatus.hidden = true; }));
      }catch(error){
        console.error(error);
        window.previewError = error?.stack || error?.message || String(error);
        previewStatus.textContent = "プレビューの準備に失敗しました。ページを再読み込みしてください。";
      }
    }, { once:true });

    window.addEventListener("beforeunload", restoreOriginalStorage, { once:true });
    setPreviewStorage();
    appFrame.src = `../index.html?__hncheck=growth-prediction-beta-${Date.now()}`;
  </script>
</body>
</html>
