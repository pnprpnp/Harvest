<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>シミュタブ 計算後・実画面プレビュー</title>
  <style>
    :root{
      color-scheme:light;
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif;
      background:#edf1ee;
      color:#243029;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:#edf1ee;}
    button{font:inherit;}
    .previewPage{
      min-height:100dvh;
      display:grid;
      justify-items:center;
      align-content:start;
      gap:10px;
      padding:12px;
    }
    .previewControls{
      width:min(100%,393px);
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      align-items:center;
      gap:10px;
      min-height:42px;
      padding:6px 7px 6px 12px;
      border:1px solid #d6dfd9;
      border-radius:12px;
      background:#fff;
      box-shadow:0 4px 16px rgba(29,64,40,.08);
    }
    .previewLabel{font-size:12px;font-weight:750;line-height:1.35;}
    .previewLabel small{display:block;color:#758179;font-size:9px;font-weight:650;}
    .previewSwitch{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:2px;
      padding:2px;
      border-radius:9px;
      background:#e8eeea;
    }
    .previewSwitch button{
      min-height:30px;
      padding:4px 11px;
      border:0;
      border-radius:7px;
      background:transparent;
      color:#68746c;
      font-size:11px;
      font-weight:750;
      white-space:nowrap;
    }
    .previewSwitch button[aria-pressed="true"]{
      background:#fff;
      color:#137847;
      box-shadow:0 1px 4px rgba(31,65,42,.12);
    }
    .appViewport{
      position:relative;
      width:393px;
      height:852px;
      max-width:calc(100vw - 24px);
      overflow:hidden;
      border:1px solid #d2dad5;
      border-radius:24px;
      background:#f7f7f9;
      box-shadow:0 18px 48px rgba(25,53,35,.16);
    }
    .appViewport iframe{
      display:block;
      width:393px;
      height:852px;
      border:0;
      background:#f7f7f9;
    }
    .previewStatus{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      padding:24px;
      background:#f7f7f9;
      color:#66736b;
      font-size:13px;
      font-weight:700;
      text-align:center;
      z-index:2;
    }
    .previewStatus[hidden]{display:none;}
    @media(max-width:416px){
      .previewPage{padding:8px 0 0;}
      .previewControls{width:calc(100% - 16px);}
      .appViewport{
        width:100vw;
        max-width:100vw;
        border-right:0;
        border-bottom:0;
        border-left:0;
        border-radius:0;
        box-shadow:none;
      }
      .appViewport iframe{width:100vw;}
    }
  </style>
</head>
<body>
  <main class="previewPage">
    <section class="previewControls" aria-label="変更前後の比較">
      <div class="previewLabel">
        計算設定の見出し
        <small>下は実際のアプリ画面です</small>
      </div>
      <div class="previewSwitch" role="group" aria-label="表示する見出し">
        <button type="button" data-heading-version="before" aria-pressed="false">変更前</button>
        <button type="button" data-heading-version="after" aria-pressed="true">変更後</button>
      </div>
    </section>

    <section class="appViewport" aria-label="Harvestnaviの実画面プレビュー">
      <iframe id="appFrame" title="Harvestnavi シミュタブの実画面"></iframe>
      <div id="previewStatus" class="previewStatus" role="status">実際のアプリ画面を準備しています…</div>
    </section>
  </main>

  <script>
    const appFrame = document.getElementById("appFrame");
    const previewStatus = document.getElementById("previewStatus");
    const versionButtons = [...document.querySelectorAll("[data-heading-version]")];
    let currentVersion = "after";
    let calculatedHeading = "ロス 7.3%・20 / 16 / 60(2/3)";

    function setStatus(message){
      previewStatus.textContent = message;
      previewStatus.hidden = !message;
    }

    function applyHeadingVersion(){
      const summary = appFrame.contentDocument?.getElementById("forecastSettingsSummary");
      if(!summary) return;
      summary.textContent = currentVersion === "before"
        ? calculatedHeading.replace(/^ロス\s+/, "ロス 全体 ")
        : calculatedHeading;
      versionButtons.forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.headingVersion === currentVersion));
      });
    }

    function seedCalculatedSimulation(){
      const app = appFrame.contentWindow;
      const result = app.eval(`(() => {
        saveHarvestStateToStorage = () => true;
        scheduleHarvestStateSave = () => {};
        protectedAccessUnlocked = true;

        settings = {
          ...settings,
          defaultLossRate: 10,
          harvestLossRatesByPlantingCount: { 12: 3, 16: "", 20: 6 },
          usePlantingCountLossSettings: true,
          defaultYieldPerPallet: 20,
          defaultPlantingCount: 16,
          useBedLossSettings: false,
          useBedYieldSettings: false,
          useBedPlantSettings: false,
          seedlingLossRate: 0,
          specialPallet60CountPer3: 2
        };
        invalidateNormalizedBedCalculationSettings();
        populateSettingsForm();

        const previewPalletKeys = [];
        const plantingCountsByPallet = {};
        BUILDINGS.forEach(building => {
          bedOrder.forEach(bed => {
            for(let number = 1; number <= PALLETS_PER_BED; number++){
              const key = getPalletKey(building, bed, number);
              const patternIndex = previewPalletKeys.length % 12;
              previewPalletKeys.push(key);
              plantingCountsByPallet[key] = patternIndex < 4 ? 12 : (patternIndex < 10 ? 16 : 20);
            }
          });
        });

        records = [];
        plantingEvents = [normalizePlantingEvent({
          palletNumberingVersion: CURRENT_PALLET_NUMBERING_VERSION,
          eventId: 202608240001,
          plantingDate: "2026-08-24",
          sourceAllocations: [{
            harvestRecordId: 1,
            palletKeys: previewPalletKeys
          }],
          plantingPalletKeys: previewPalletKeys,
          plantingCountsByPallet,
          actualSeedlingTrayCount: 64,
          actualTakenSeedlingCount: 8000,
          actualPlantedSeedlingCount: 6900,
          actualSeedlingCarryoverMode: "loss",
          actualSeedlingLossRate: "0",
          qualityMemo: null,
          detailsUnknown: false
        })].filter(Boolean);
        invalidateHarvestRecordEditTimelineCache();
        invalidateRecordHistoryCache();
        invalidatePlantingEventStateCache();
        invalidateCurrentPalletLifecycleState();
        rebuildCurrentPalletLifecycleState({ persist:false });

        currentBuilding = 2;
        casePlacementBuilding = 2;
        casePlacementByBuilding = {
          "2": { front:34, middle:33, back:33 }
        };
        document.getElementById("recordDateInput").value = "2026-09-08";
        document.getElementById("casesInput").value = "100";
        populateCasePlacementInputs();
        setMainTabSelection("forecast");
        activeAppTab = "forecast";
        const selection = runHarvestPrediction({
          silent:true,
          skipLeftoverAlert:true
        });
        if(!selection || !harvestSummary) throw new Error("計算済み状態を作成できませんでした");
        harvestSummary.appliedLossRate = 7.3;
        updateForecastSettingsSummary(harvestSummary.totalHarvest);
        refreshCalculationSettingsClusterValues();
        updateWorkflowGuide();
        document.getElementById("welcomeScreen")?.remove();
        window.scrollTo(0, 0);
        return document.getElementById("forecastSettingsSummary")?.textContent || "";
      })()`);
      if(!result) throw new Error("計算設定の見出しを表示できませんでした");
      calculatedHeading = result.replace(/^ロス\s+全体\s+/, "ロス ");
      localStorage.clear();
      sessionStorage.clear();
    }

    versionButtons.forEach(button => {
      button.addEventListener("click", () => {
        currentVersion = button.dataset.headingVersion;
        applyHeadingVersion();
      });
    });

    appFrame.addEventListener("load", () => {
      try{
        seedCalculatedSimulation();
        applyHeadingVersion();
        requestAnimationFrame(() => requestAnimationFrame(() => setStatus("")));
      }catch(error){
        console.error(error);
        setStatus("プレビューの準備に失敗しました。ページを再読み込みしてください。");
      }
    }, { once:true });

    localStorage.clear();
    sessionStorage.clear();
    localStorage.setItem("harvestnaviThemePreference_v1", "light");
    localStorage.setItem("harvestnaviWorkflowTitleHintShown_v1", "1");
    localStorage.setItem("harvestForecastProtectedAccessAuth_v1", "1");
    appFrame.src = `../index.html?exact-simulation-preview=${Date.now()}`;
  </script>
</body>
</html>
