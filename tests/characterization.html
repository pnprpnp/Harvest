<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harvestnavi 特性テスト</title>
  <style>
    body {
      margin: 32px auto;
      max-width: 760px;
      padding: 0 20px;
      color: #24212d;
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
    }
    h1 { font-size: 1.5rem; }
    #summary { font-weight: 700; }
    li[data-test-status="passed"]::marker { color: #16834b; }
    li[data-test-status="failed"] { color: #b42318; }
    iframe {
      position: fixed;
      left: -10000px;
      width: 390px;
      height: 844px;
      border: 0;
    }
  </style>
</head>
<body>
  <h1>Harvestnavi 特性テスト</h1>
  <p id="summary">アプリを読み込んでいます…</p>
  <ol id="testResults"></ol>

  <script>
  (() => {
    "use strict";

    const root = document.documentElement;
    const summary = document.getElementById("summary");
    const results = document.getElementById("testResults");
    const storageSnapshots = {
      local: snapshotStorage(localStorage),
      session: snapshotStorage(sessionStorage)
    };
    let finished = false;
    let passedCount = 0;
    let failedCount = 0;

    function snapshotStorage(storage){
      const snapshot = {};
      for(let index = 0; index < storage.length; index++){
        const key = storage.key(index);
        snapshot[key] = storage.getItem(key);
      }
      return snapshot;
    }

    function restoreStorage(storage, snapshot){
      storage.clear();
      Object.entries(snapshot).forEach(([key, value]) => storage.setItem(key, value));
    }

    function comparable(value){
      return JSON.parse(JSON.stringify(value));
    }

    function assert(condition, message){
      if(!condition) throw new Error(message);
    }

    function assertEqual(actual, expected, message){
      if(actual !== expected){
        throw new Error(`${message}（期待: ${JSON.stringify(expected)}、実際: ${JSON.stringify(actual)}）`);
      }
    }

    function assertDeepEqual(actual, expected, message){
      const actualText = JSON.stringify(comparable(actual));
      const expectedText = JSON.stringify(comparable(expected));
      if(actualText !== expectedText){
        throw new Error(`${message}（期待: ${expectedText}、実際: ${actualText}）`);
      }
    }

    function assertThrows(body, expectedMessage, message){
      let caught = null;
      try{
        body();
      }catch(error){
        caught = error;
      }
      if(!caught) throw new Error(message + "（エラーが発生しませんでした）");
      if(expectedMessage && !String(caught?.message || caught).includes(expectedMessage)){
        throw new Error(
          `${message}（期待する内容: ${JSON.stringify(expectedMessage)}、実際: ${JSON.stringify(caught?.message || String(caught))}）`
        );
      }
    }

    async function runTest(name, body){
      const item = document.createElement("li");
      try{
        await body();
        item.dataset.testStatus = "passed";
        item.textContent = `成功: ${name}`;
        passedCount++;
      }catch(error){
        item.dataset.testStatus = "failed";
        item.textContent = `失敗: ${name} — ${error?.message || String(error)}`;
        failedCount++;
      }
      results.appendChild(item);
    }

    function replaceAppHistory(app, nextRecords, nextPlantingEvents = []){
      const recordsJson = JSON.stringify(nextRecords);
      const plantingEventsJson = JSON.stringify(nextPlantingEvents);
      app.eval(`
        records = ${recordsJson}.map(normalizeStoredRecord).filter(Boolean);
        plantingEvents = ${plantingEventsJson}.map(normalizePlantingEvent).filter(Boolean);
        invalidateHarvestRecordEditTimelineCache();
        invalidateRecordHistoryCache();
      `);
    }

    function finish(iframes){
      if(finished) return;
      finished = true;
      (Array.isArray(iframes) ? iframes : [iframes]).forEach(iframe => iframe?.remove());
      restoreStorage(localStorage, storageSnapshots.local);
      restoreStorage(sessionStorage, storageSnapshots.session);
      root.dataset.testStatus = failedCount ? "failed" : "passed";
      root.dataset.testCount = String(passedCount + failedCount);
      root.dataset.testPassed = String(passedCount);
      root.dataset.testFailed = String(failedCount);
      summary.textContent = failedCount
        ? `${failedCount}件失敗、${passedCount}件成功`
        : `全${passedCount}件成功`;
      const testResults = [...results.querySelectorAll("li[data-test-status]")].map(item => ({
        status: item.dataset.testStatus,
        message: item.textContent
      }));
      fetch("/__harvestnavi_characterization_result__", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          status: root.dataset.testStatus,
          passed: passedCount,
          failed: failedCount,
          results: testResults
        }),
        keepalive: true
      }).catch(() => {});
    }

    function loadAppsScriptHarness(){
      return new Promise((resolve, reject) => {
        const iframe = document.createElement("iframe");
        iframe.title = "テスト対象のHarvestnavi Apps Script";
        const timeout = setTimeout(() => {
          iframe.remove();
          reject(new Error("Apps Scriptテスト環境を10秒以内に読み込めませんでした"));
        }, 10000);
        iframe.addEventListener("load", () => {
          clearTimeout(timeout);
          resolve(iframe);
        }, { once: true });
        iframe.src = `apps-script-harness.html?__hncheck=1&characterization-test=${Date.now()}`;
        document.body.appendChild(iframe);
      });
    }

    function loadVisualAppFrame(width, height, source = `../index.html?visual-characterization=${Date.now()}`){
      return new Promise((resolve, reject) => {
        const visualFrame = document.createElement("iframe");
        visualFrame.title = "見た目比較用のHarvestnavi";
        visualFrame.style.width = `${width}px`;
        visualFrame.style.height = `${height}px`;
        const timeout = setTimeout(() => {
          visualFrame.remove();
          reject(new Error("見た目比較用の画面を10秒以内に読み込めませんでした"));
        }, 10000);
        visualFrame.addEventListener("load", () => {
          clearTimeout(timeout);
          resolve(visualFrame);
        }, { once: true });
        visualFrame.src = source;
        document.body.appendChild(visualFrame);
      });
    }

    function getVisualFingerprint(app){
      const properties = [
        "display", "position", "inset", "top", "right", "bottom", "left",
        "width", "height", "minWidth", "maxWidth", "minHeight", "maxHeight",
        "marginTop", "marginRight", "marginBottom", "marginLeft",
        "paddingTop", "paddingRight", "paddingBottom", "paddingLeft",
        "borderTopWidth", "borderRightWidth", "borderBottomWidth", "borderLeftWidth",
        "borderTopColor", "borderRightColor", "borderBottomColor", "borderLeftColor",
        "borderRadius", "backgroundColor", "backgroundImage", "color", "opacity",
        "visibility", "boxShadow", "transform", "overflow", "overflowX", "overflowY",
        "fontFamily", "fontSize", "fontWeight", "lineHeight", "letterSpacing",
        "textAlign", "gap", "rowGap", "columnGap", "gridTemplateColumns",
        "gridTemplateRows", "flexDirection", "alignItems", "justifyContent"
      ];
      const entries = [];
      let visibleCount = 0;
      [...app.document.body.querySelectorAll("*")].forEach((element, index) => {
        const style = app.getComputedStyle(element);
        const rect = element.getBoundingClientRect();
        const isVisible = style.display !== "none"
          && style.visibility !== "hidden"
          && rect.width > 0
          && rect.height > 0;
        if(isVisible) visibleCount++;
        const identity = [
          index,
          element.localName,
          element.id || "",
          element.getAttribute("class") || ""
        ];
        const geometry = isVisible
          ? [rect.x, rect.y, rect.width, rect.height].map(value => Math.round(value * 100) / 100)
          : [];
        const values = properties.map(property => style[property]);
        const before = app.getComputedStyle(element, "::before");
        const after = app.getComputedStyle(element, "::after");
        entries.push(JSON.stringify([
          identity,
          geometry,
          values,
          [before.content, before.display, before.color, before.backgroundColor],
          [after.content, after.display, after.color, after.backgroundColor]
        ]));
      });
      let hash = 2166136261;
      const source = entries.join("\n");
      for(let index = 0; index < source.length; index++){
        hash ^= source.charCodeAt(index);
        hash = Math.imul(hash, 16777619);
      }
      return {
        hash: (hash >>> 0).toString(16).padStart(8, "0"),
        elements: entries.length,
        visible: visibleCount,
        viewport: `${app.innerWidth}x${app.innerHeight}`
      };
    }

    async function settleVisualApp(app){
      if(app.document.fonts?.ready) await app.document.fonts.ready;
      await new Promise(resolve => app.requestAnimationFrame(() => (
        app.requestAnimationFrame(() => app.setTimeout(resolve, 120))
      )));
    }

    function createVisualStateFixture(app){

      fixture.id = "visualStateFixture";
      fixture.style.cssText = "position:fixed;left:-1200px;top:0;width:1000px;z-index:-1;";
      fixture.innerHTML = `
        <label class="fieldAccentLabel">入力見本</label>
        <input class="emptyInputField" placeholder="未入力">
        <input class="recordInputNeedsAttention" placeholder="要確認">
        <div class="inputUnitWrap"><input class="emptyInputField"><span class="inputUnitSuffix">ケース</span></div>
        <span class="seedlingInlineWrap"><input class="seedlingInlineInput"><span class="seedlingInlineSuffix">枚</span></span>
        <div class="casePlacementGrid"><div class="casePlacementItem"><label>手前</label></div></div>
        <div class="bedMiniMapBar">
          <span class="bedMiniMapSegment partialHarvest"></span>
          <span class="bedMiniMapSegment selected partialHarvest"></span>
          <span class="bedMiniMapSegment recorded partialHarvest"></span>
          <span class="bedMiniMapSegment recorded partial partialHarvest"></span>
        </div>
        <div class="plantingBedMap"><div class="bedMiniMapBar">
          <span class="bedMiniMapSegment plantingSelectable"></span>
          <span class="bedMiniMapSegment plantingSelected"></span>
          <span class="bedMiniMapSegment plantingUnavailable"></span>
        </div></div>
        <div class="palletGrid">
          <span class="pallet multiple8Pair"></span><span class="pallet centerStrong"></span>
          <span class="pallet harvestFill"></span><span class="pallet harvestStart"></span>
          <span class="pallet harvestEnd"></span><span class="pallet recordedPallet"></span>
          <span class="pallet partialHarvestPallet"></span><span class="pallet partialHarvestPallet recordedPallet"></span>
          <span class="pallet plantingSelectablePallet"></span><span class="pallet plantingSelectedPallet"></span>
          <span class="pallet plantingUnavailablePallet"></span><span class="pallet harvestProgressCompletedPallet"></span>
        </div>
        <div class="monitorBedBar">
          <span class="monitorBedSegment partialHarvest"></span>
          <span class="monitorBedSegment selected partialHarvest"></span>
          <span class="monitorBedSegment recorded partialHarvest"></span>
          <span class="monitorBedSegment recorded partial partialHarvest"></span>
        </div>
        <button class="harvestProgressBed is-selected"><span class="bedMiniMapSegment"></span></button>
        <div class="bed harvestProgressCompletedBed"><span class="bedMiniMapSegment"></span></div>
        <div class="bed bedCollapsed simulationBedOverview harvestProgressCompletedBed"></div>
        <div class="recordBedOverview">
          <span class="simulationBedMapCell is-planting-selectable"></span>
          <span class="simulationBedMapCell is-planting-selected"></span>
          <span class="simulationBedMapCell is-planting-unavailable"></span>
        </div>
        <div class="recordDateInputRow"><input id="visualRecordDateInput" class="recordInputNeedsAttention" type="date"></div>
        <div class="dashboardForecastValueInput"><input></div>
        <div class="dashboardForecastValueInput autoValue"><input></div>
        <label class="qualityChoice"><input type="checkbox">通常</label>
        <label class="qualityChoice"><input type="checkbox" checked>選択</label>
        <label class="qualityChoice qualityProblem"><input type="checkbox" checked>問題</label>
        <div class="dashboardSeedlingStatusBed has-lot-selection">
          <span class="dashboardSeedlingBedMapCell"></span>
          <span class="dashboardSeedlingBedMapCell is-lot-selected is-lot-edge-top"></span>
        </div>
        <div class="recordLegendItem" hidden>非表示</div>
        <div class="recordStageSection" hidden>非表示</div>
        <div class="dashboardSubtabPanel" hidden>非表示</div>
      `;
      app.document.body.appendChild(fixture);
      return fixture;
    }

    async function collectVisualFingerprints(){
      localStorage.clear();
      sessionStorage.clear();
      localStorage.setItem("harvestnaviWorkflowTitleHintShown_v1", "1");
      const visualFrame = await loadVisualAppFrame(390, 844);
      const app = visualFrame.contentWindow;
      try{
        app.eval("protectedAccessUnlocked = true");
        const stabilityStyle = app.document.createElement("style");
        stabilityStyle.textContent = "*,*::before,*::after{transition:none!important;animation:none!important;}";
        app.document.head.appendChild(stabilityStyle);
        app.document.getElementById("welcomeScreen")?.remove();
        await settleVisualApp(app);
        const fingerprints = {
          mobileForecast: getVisualFingerprint(app)
        };
        const stateFixture = createVisualStateFixture(app);
        fingerprints.cssStates = getVisualFingerprint(app);
        stateFixture.querySelector(".emptyInputField")?.focus();
        fingerprints.cssFocus = getVisualFingerprint(app);
        stateFixture.remove();

        app.switchTab("record");
        const qualityInput = app.document.querySelector(".qualityChoice input");
        if(qualityInput) qualityInput.checked = true;
        await settleVisualApp(app);
        fingerprints.mobileRecord = getVisualFingerprint(app);

        app.switchTab("dashboard");
        await settleVisualApp(app);
        fingerprints.mobileDashboard = getVisualFingerprint(app);

        app.openAppMenuWindow();
        await settleVisualApp(app);
        fingerprints.mobileMenu = getVisualFingerprint(app);
        app.closeAppMenuWindow();

        app.openForecastSettingsWindow();
        await settleVisualApp(app);
        fingerprints.mobileSettings = getVisualFingerprint(app);
        app.closeForecastSettingsWindow();

        app.switchTab("monitor");
        await settleVisualApp(app);
        fingerprints.mobileMonitor = getVisualFingerprint(app);

        visualFrame.style.width = "1024px";
        visualFrame.style.height = "900px";
        app.switchTab("forecast");
        await settleVisualApp(app);
        fingerprints.wideForecast = getVisualFingerprint(app);

        app.switchTab("dashboard");
        await settleVisualApp(app);
        fingerprints.wideDashboard = getVisualFingerprint(app);
        return fingerprints;
      }finally{
        visualFrame.remove();
      }
    }

    async function runCharacterizationTests(iframe, appsScriptIframe){
      const app = iframe.contentWindow;
      const appsScript = appsScriptIframe.contentWindow;
      const requiredFunctions = [
        "createBrowserStorageGateway",
        "compressPalletKeysToRanges",
        "expandPalletRangesToKeys",
        "formatPalletSummary",
        "parsePalletSummaryToKeys",
        "normalizePartialHarvestTargets",
        "normalizeStoredRecord",
        "normalizeRecordSnapshot",
        "normalizeImportedRecord",
        "serializeRecordForStorage",
        "buildGoogleSheetRecordPayload",
        "buildGoogleSheetCombinedSyncPayload",
        "buildGoogleSheetUpdateCheckPayload",
        "buildGoogleSheetBatchPayload",
        "buildGoogleSheetRecordDeletePayload",
        "buildGoogleSheetRecordRestorePayload",
        "buildGoogleSheetPlantingEventPayload",
        "buildGoogleSheetPlantingEventListPayload",
        "buildGoogleSheetMonitorContentPayload",
        "buildGoogleSheetMonitorSavePayload",
        "buildGoogleSheetMonitorHistoryPayload",
        "getHarvestRecordIdentity",
        "getHarvestRecordIdentityKey",
        "findHarvestRecordByIdentity",
        "harvestRecordMatchesIdentity",
        "invalidateRecordDerivedCaches",
        "getHarvestRecordCaseDisplayText",
        "getHarvestRecordEditTimelineRecords",
        "buildRecordConsistencyAudit",
        "getHarvestRecordSyncContentSignature",
        "getSyncConflictLookupKey",
        "showPageBlockingUi",
        "hidePageBlockingUi",
        "normalizeMainTabName",
        "setMainTabSelection",
        "setMainTabLoadingState",
        "switchTab",
        "appendBedOverviewMap",
        "drawRecordBeds",
        "installStaticUiEventHandlers",
        "restoreHarvestStateAtStartup",
        "initializeStartupViews",
        "installStartupRecordFormEvents",
        "installStartupDashboardEvents",
        "initializeHarvestnaviApp",
        "openDashboardForecastInfoWindow",
        "closeDashboardForecastInfoWindow",
        "openDashboardCalendarInfoWindow",
        "closeDashboardCalendarInfoWindow"
      ];

      await runTest("主要な計算関数を読み込める", () => {
        const missing = requiredFunctions.filter(name => typeof app[name] !== "function");
        assertDeepEqual(missing, [], `読み込めない関数があります: ${missing.join(", ")}`);
      });

      await runTest("ブラウザー内保存を共通窓口で読み書き・退避・復元する", () => {
        const state = comparable(app.eval(`(() => {
          const values = new Map();
          const storage = {
            getItem(key){ return values.has(String(key)) ? values.get(String(key)) : null; },
            setItem(key, value){ values.set(String(key), String(value)); },
            removeItem(key){ values.delete(String(key)); }
          };
          const gateway = createBrowserStorageGateway(storage, "テスト保存");
          gateway.setItem("plain", 12);
          gateway.writeJson("json", { count: 2, text: "保持" });
          const jsonText = storage.getItem("json");
          const snapshot = gateway.snapshotItems(["plain", "json", "missing"]);
          gateway.setItem("plain", "changed");
          gateway.setItem("missing", "temporary");
          gateway.restoreItems(snapshot, ["plain", "json", "missing"]);

          gateway.setItem("broken", "{");
          let parseError = null;
          try{
            gateway.readJson("broken", null);
          }catch(error){
            parseError = {
              name: error.name,
              operation: error.operation,
              storageKey: error.storageKey
            };
          }

          return {
            plain: gateway.getItem("plain"),
            json: gateway.readJson("json", null),
            jsonText,
            missing: gateway.getItem("missing"),
            parseError
          };
        })()`));
        assertDeepEqual(state, {
          plain: "12",
          json: { count: 2, text: "保持" },
          jsonText: '{"count":2,"text":"保持"}',
          missing: null,
          parseError: {
            name: "HarvestnaviStorageError",
            operation: "JSON読み込み",
            storageKey: "broken"
          }
        }, "共通保存窓口で値またはエラー情報が変わりました");
      });

      await runTest("Apps Scriptの同期・正規化関数を読み込める", () => {
        const requiredAppsScriptFunctions = [
          "resolveApiOperation",
          "normalizeHarvestRecord",
          "normalizePlantingEvent",
          "normalizeHarvestSyncRevision",
          "normalizeSyncChangeEntry",
          "getHarvestSyncRevisionState",
          "normalizeHarvestRecordSyncCursor",
          "normalizePlantingEventSyncCursor",
          "assertRecordIsNotDeleted",
          "extractSpreadsheetId",
          "getSpreadsheet",
          "setupHarvestSpreadsheetId",
          "getAppsScriptContractSnapshot",
          "resetAppsScriptTestState"
        ];
        assertEqual(appsScript.__appsScriptSourceLoaded, true, "Apps Script本体の読み込みが完了していません");
        assertEqual(appsScript.__appsScriptLoadError, "", "Apps Script本体の読み込み中にエラーが発生しました");
        const missing = requiredAppsScriptFunctions.filter(name => typeof appsScript[name] !== "function");
        assertDeepEqual(missing, [], `読み込めないApps Script関数があります: ${missing.join(", ")}`);
      });

      await runTest("ブラウザー側とApps Script側の同期上限・項目を一致させる", () => {
        const clientContract = comparable(app.eval(`({
          requestCharacters: GOOGLE_SHEET_MAX_REQUEST_CHARS,
          requestBytes: GOOGLE_SHEET_MAX_REQUEST_BYTES,
          batchRecords: GOOGLE_SHEET_MAX_BATCH_RECORDS,
          recordList: GOOGLE_SHEET_MAX_LIST_RECORDS,
          recordTombstones: GOOGLE_SHEET_MAX_LIST_RECORD_TOMBSTONES,
          plantingList: GOOGLE_SHEET_MAX_LIST_PLANTING_EVENTS,
          plantingTombstones: GOOGLE_SHEET_MAX_LIST_PLANTING_EVENT_TOMBSTONES,
          monitorHistory: GOOGLE_SHEET_MAX_HISTORY_ITEMS,
          recordCases: RECORD_MAX_CASES,
          seedlingTrays: RECORD_MAX_SEEDLING_TRAYS,
          palletKeys: RECORD_MAX_PALLET_KEYS,
          targets: RECORD_MAX_TARGETS,
          memoLength: RECORD_MAX_MEMO_LENGTH,
          summaryLength: RECORD_MAX_SUMMARY_LENGTH,
          qualityLength: RECORD_MAX_QUALITY_LENGTH,
          duplicateKeyLength: RECORD_MAX_DUPLICATE_KEY_LENGTH,
          uuidLength: RECORD_UUID_MAX_LENGTH,
          buildings: [...BUILDINGS],
          beds: [...bedOrder],
          palletsPerBed: PALLETS_PER_BED,
          palletNumberingVersion: CURRENT_PALLET_NUMBERING_VERSION,
          recordSyncSchemaVersion: RECORD_SYNC_SCHEMA_VERSION,
          recordSyncFields: [...RECORD_SYNC_FIELD_KEYS]
        })`));
        const serverContract = comparable(appsScript.getAppsScriptContractSnapshot());
        const sharedClientContract = { ...clientContract };
        const sharedServerContract = { ...serverContract };
        delete sharedClientContract.recordSyncSchemaVersion;
        delete sharedServerContract.recordSyncSchemaVersion;
        delete sharedServerContract.recordSyncMinimumProvidedFieldsVersion;
        assertDeepEqual(sharedServerContract, sharedClientContract, "同期仕様の上限または項目が食い違っています");
        assert(
          clientContract.recordSyncSchemaVersion >= serverContract.recordSyncMinimumProvidedFieldsVersion,
          "ブラウザー側の同期形式をApps Script側が受け付けられません"
        );
        assert(
          serverContract.recordSyncSchemaVersion >= clientContract.recordSyncSchemaVersion,
          "Apps Script側の同期形式をブラウザー側が受け付けられません"
        );
      });

      await runTest("ブラウザーが作るAPI操作をApps Script側で同じ操作として解釈する", () => {
        const config = { token: "characterization-test-token" };
        const record = app.normalizeRecordSnapshot({
          palletNumberingVersion: 2,
          id: 20000000000001,
          recordUuid: "33333333-3333-4333-8333-333333333333",
          syncSchemaVersion: 3,
          syncProvidedFields: ["plantingCaseInstruction", "actualSeedlingCarryoverMode"],
          type: "fullHarvest",
          date: "2026-08-09",
          cases: 12,
          palletKeys: ["2-A-1", "2-A-2"],
          plantingPalletKeys: ["2-A-1"],
          plannedSeedlingTrayCount: 1,
          plantingCaseInstruction: "手前",
          actualSeedlingTrayCount: 1,
          actualSeedlingCarryoverMode: "loss",
          actualSeedlingLossRate: "0",
          actualLoss: "2.5",
          qualityMemo: { tags: ["large"], other: "" },
          plantingPending: true,
          memo: "契約テスト"
        });
        const event = app.normalizePlantingEvent({
          palletNumberingVersion: 2,
          eventId: 20000000000002,
          plantingDate: "2026-08-09",
          sourceAllocations: [{ harvestRecordId: record.id, palletKeys: ["2-A-1"] }],
          plantingPalletKeys: ["2-A-1"],
          actualSeedlingTrayCount: 1,
          actualTakenSeedlingCount: 120,
          actualPlantedSeedlingCount: 20,
          actualSeedlingCarryoverMode: "loss",
          actualSeedlingLossRate: "0",
          qualityMemo: null,
          detailsUnknown: false
        });
        assert(record && event, "契約テスト用の記録を作成できません");

        const operationCases = [
          [app.buildGoogleSheetUpdateCheckPayload(config, { syncRevision: 1 }), "checkUpdates"],
          [app.buildGoogleSheetCombinedSyncPayload(config, { syncRevision: 1 }), "syncAll"],
          [app.buildGoogleSheetRecordPayload(record, config), "saveRecord"],
          [app.buildGoogleSheetBatchPayload([record], config), "saveRecordBatch"],
          [app.buildGoogleSheetRecordDeletePayload(record, config), "deleteRecord"],
          [app.buildGoogleSheetRecordRestorePayload(record, config), "restoreRecord"],
          [app.buildGoogleSheetPlantingEventListPayload(config), "listPlantingEvents"],
          [app.buildGoogleSheetPlantingEventPayload(event, config, "save"), "savePlantingEvent"],
          [app.buildGoogleSheetPlantingEventPayload(event, config, "delete"), "deletePlantingEvent"],
          [app.buildGoogleSheetPlantingEventPayload(event, config, "restore"), "restorePlantingEvent"],
          [app.buildGoogleSheetMonitorContentPayload(config), "getMonitorContent"],
          [app.buildGoogleSheetMonitorSavePayload(config, { enabled: true }), "saveMonitorContent"],
          [app.buildGoogleSheetMonitorHistoryPayload(config, { limit: 20 }), "listMonitorHistory"]
        ];
        operationCases.forEach(([payload, expectedOperation]) => {
          assertEqual(
            appsScript.resolveApiOperation(comparable(payload)),
            expectedOperation,
            `${expectedOperation}のAPI操作が一致しません`
          );
        });
      });

      await runTest("ブラウザーが送る収穫記録をApps Script側で正規化できる", () => {
        const record = app.normalizeRecordSnapshot({
          palletNumberingVersion: 2,

        assertDeepEqual(serialized.plantingRanges, ["6-E-3-4"], "苗植えの保存範囲が変わりました");
        assertEqual(Object.prototype.hasOwnProperty.call(serialized, "palletKeys"), false, "保存形式に展開済みパレットが混入しました");
        snapshot.palletKeys = ["6-E-10"];
        snapshot.plantingPalletKeys = ["6-E-10"];
        const edited = app.serializeRecordForStorage(snapshot);
        assertDeepEqual(edited.palletRanges, ["6-E-10-10"], "編集前の収穫場所が保存時に復活しました");
        assertDeepEqual(edited.plantingRanges, ["6-E-10-10"], "編集前の苗植え場所が保存時に復活しました");
        const editedSnapshot = app.normalizeRecordSnapshot(snapshot);
        assertDeepEqual(editedSnapshot.palletKeys, ["6-E-10"], "スナップショット内で編集前の収穫場所が復活しました");
        assertDeepEqual(editedSnapshot.plantingPalletKeys, ["6-E-10"], "スナップショット内で編集前の苗植え場所が復活しました");
        const imported = app.normalizeImportedRecord(currentRecord, 0);
        assert(imported, "現行形式の通常収穫記録をインポート経路で正規化できません");
        assertDeepEqual(imported.palletKeys, ["6-E-3", "6-E-4", "6-E-5"], "インポート時に収穫場所が欠落しました");
        assertDeepEqual(imported.qualityMemo, { tags: ["large"], other: "" }, "インポート時に品質情報が欠落しました");

        const oldDatedCurrentRecord = appsScript.normalizeHarvestRecord({
          ...currentRecord,
          id: 45,
          recordUuid: "cccccccc-cccc-4ccc-8ccc-cccccccccccd",
          date: "2026-06-01",
          palletSummary: "9号棟F:77-78",
          palletKeys: ["2-A-1", "2-A-2"],
          plantingPalletKeys: []
        });
        assertEqual(
          oldDatedCurrentRecord.palletSummary,
          "2号棟A:1-2",
          "古い日付の現行記録で旧収穫場所文字列を優先しています"
        );
      });

      await runTest("旧パレット番号方式の記録を受け付けない", () => {

        assertThrows(
          () => appsScript.normalizeHarvestRecord({
            ...oldRecord,

          "パレット番号方式",

          palletNumberingVersion: 1,

        assertThrows(
          () => appsScript.normalizeMonitorContentInput(oldMonitorContent),

      await runTest("廃止した旧形式移行処理を読み込まない", () => {

          palletNumbering: "undefined",
          plantingEvents: "undefined",
          conflicts: "undefined"
        }, "端末側に廃止済みの移行処理が残っています");

        assertEqual(
          typeof appsScript.migrateAllPalletNumberingToLeftOriginOnce,
          "undefined",
          "Apps Script側に旧パレット番号の移行処理が残っています"
        );
        assertEqual(
          typeof appsScript.migrateHarvestRecordSyncMetadataV1,
          "undefined",
          "Apps Script側に旧記録情報の自動移行処理が残っています"
        );
      });

      await runTest("途中収穫の記録スナップショットも同じ経路で正規化する", () => {
        const snapshot = app.normalizeRecordSnapshot({
          palletNumberingVersion: 2,
          id: 42,
          recordUuid: "bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbc",
          type: "partialHarvest",
          date: "2026-08-08",
          cases: 3,
          memo: "途中",
          targets: [{ building: 7, bed: "B", start: 6, end: 2, plantsPerPallet: 11 }]
        });
        assert(snapshot, "途中収穫記録を正規化できません");
        assertDeepEqual(snapshot.targets, [
          { building: 7, bed: "B", start: 2, end: 6, plantsPerPallet: 11 }
        ], "途中収穫場所の保存内容が変わりました");
        const serialized = app.serializeRecordForStorage(snapshot);
        assertEqual(serialized.type, "partialHarvest", "途中収穫の種類が変わりました");
        assertEqual(Object.prototype.hasOwnProperty.call(serialized, "palletRanges"), false, "途中収穫へ通常収穫の範囲が混入しました");
      });

      await runTest("同じ日の通常収穫と途中収穫を現在の表示規則で集計する", () => {
        const full = { id: 1, type: "fullHarvest", date: "2026-08-02", cases: 100 };
        const partial = { id: 2, type: "partialHarvest", date: "2026-08-02", cases: 20 };
        const totals = app.getHarvestCaseTotalsByDate([full, partial]);
        assertEqual(app.getHarvestRecordCaseDisplayText(full, totals), "120", "通常収穫側の合計表示が違います");
        assertEqual(app.getHarvestRecordCaseDisplayText(partial, totals), "(20)", "途中収穫側の内数表示が違います");
      });

      await runTest("過去の記録を編集するとき、対象以降の記録を計算から外す", () => {
        replaceAppHistory(app, [
          { palletNumberingVersion: 2, id: 1, recordUuid: "10000000-0000-4000-8000-000000000001", type: "fullHarvest", date: "2026-08-01", cases: 10, palletRanges: ["2-A-1-1"], plantingPending: true },
          { palletNumberingVersion: 2, id: 2, recordUuid: "10000000-0000-4000-8000-000000000002", type: "fullHarvest", date: "2026-08-02", cases: 10, palletRanges: ["2-A-2-2"], plantingPending: true },
          { palletNumberingVersion: 2, id: 3, recordUuid: "10000000-0000-4000-8000-000000000003", type: "fullHarvest", date: "2026-08-03", cases: 10, palletRanges: ["2-A-3-3"], plantingPending: true }
        ]);
        const visibleIds = app.getHarvestRecordEditTimelineRecords(2).map(record => record.id);
        assertDeepEqual(visibleIds, [1], "編集時に残る履歴が違います");
      });

      await runTest("重複した記録と収穫済みパレットの再使用を検出する", () => {
        const common = {
          palletNumberingVersion: 2,
          type: "fullHarvest",
          date: "2026-08-04",
          cases: 10,
          palletRanges: ["2-A-1-2"],
          plantingPending: true
        };
        replaceAppHistory(app, [
          { ...common, id: 1, recordUuid: "20000000-0000-4000-8000-000000000001" },
          { ...common, id: 2, recordUuid: "20000000-0000-4000-8000-000000000002" }
        ]);
        const issues = comparable(app.buildRecordConsistencyAudit().orderedIssues);
        const reasons = issues.flatMap(issue => issue.reasons);
        assert(reasons.some(reason => reason.includes("同じ内容")), "同じ内容の記録を検出できません");
        assert(reasons.some(reason => reason.includes("収穫済みの場所と重複")), "収穫済みパレットの再使用を検出できません");
      });

      await runTest("同期比較では更新日時だけの違いを競合扱いしない", () => {
        const base = {
          id: 20,
          recordUuid: "11111111-1111-4111-8111-111111111111",
          type: "fullHarvest",
          date: "2026-08-05",
          cases: 18,
          palletRanges: ["3-B-1-2"],
          plantingPending: true
        };
        const first = app.getHarvestRecordSyncContentSignature({ ...base, updatedAt: "2026-08-05T01:00:00.000Z" });
        const second = app.getHarvestRecordSyncContentSignature({ ...base, updatedAt: "2026-08-05T02:00:00.000Z" });
        const changed = app.getHarvestRecordSyncContentSignature({ ...base, cases: 19 });
        assertEqual(first, second, "更新日時だけで同期内容が変化しました");
        assert(first !== changed, "ケース数の変更を検出できません");
      });

      await runTest("競合記録をUUIDで同じ記録として照合する", () => {
        const uuid = "22222222-2222-4222-8222-222222222222";
        const lookupKey = app.getSyncConflictLookupKey({
          entityType: "record",
          localVersion: {
            palletNumberingVersion: 2,
            id: 30,
            recordUuid: uuid,
            type: "partialHarvest",
            date: "2026-08-06",
            cases: 4,
            targets: [{ building: 5, bed: "D", start: 1, end: 2, plantsPerPallet: 9 }]

      });

      await runTest("同期する収穫記録の識別と検索をUUID優先で統一する", () => {
        const firstUuid = "AAAAAAAA-AAAA-4AAA-8AAA-AAAAAAAAAAAA";
        const secondUuid = "bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb";
        const first = { id: 70, recordUuid: firstUuid, name: "first" };
        const second = { id: 71, recordUuid: secondUuid, name: "second" };
        const identity = app.getHarvestRecordIdentity(first);
        assertDeepEqual(identity, {
          recordUuid: firstUuid.toLowerCase(),
          id: 70
        }, "収穫記録の識別情報が違います");
        assertEqual(
          app.getHarvestRecordIdentityKey(first),
          `uuid:${firstUuid.toLowerCase()}`,
          "UUIDがある記録の同期キーが違います"
        );
        assertEqual(app.getHarvestRecordIdentityKey({ id: 72 }), "id:72", "UUIDがない識別子の同期キーが違います");
        assertEqual(
          app.findHarvestRecordByIdentity({ recordUuid: secondUuid, id: 70 }, [first, second]),
          second,
          "数値IDよりUUIDを優先して検索できません"
        );
        assertEqual(
          app.findHarvestRecordByIdentity({ recordUuid: "cccccccc-cccc-4ccc-8ccc-cccccccccccc", id: 70 }, [first, second]),
          null,
          "存在しないUUIDを同じ数値IDの別記録へ切り替えています"
        );
        assertEqual(
          app.harvestRecordMatchesIdentity(first, { id: 70, recordUuid: secondUuid }),
          false,
          "異なるUUIDの記録を同一扱いしています"
        );
      });

      await runTest("記録変更後の派生キャッシュを一括で解除する", () => {

        `);

          editTimeline: harvestRecordEditTimelineCache,
          editTimelineId: harvestRecordEditTimelineCacheId,
          lookupSize: harvestRecordLookupCache.size,
          history: recordHistoryCache,
          planting: plantingEventStateCache,
          plantingKey: plantingEventStateCacheKey,
          forecast: dashboardHarvestForecastModelCache,

          calendar: dashboardPastCalendarItemsByDateCache,

          workflowReady: workflowPendingRecordCacheReady
        })`));
        assertDeepEqual(cacheState, {
          editTimeline: null,
          editTimelineId: null,
          lookupSize: 0,
          history: null,
          planting: null,
          plantingKey: "",
          forecast: null,
          seedlings: null,
          calendar: null,
          workflow: null,
          workflowReady: false
        }, "解除後も古い計算結果が残っています");
      });

      await runTest("重なった情報ウィンドウを閉じても背景スクロールを正しく管理する", () => {
        const forecastModal = app.document.getElementById("dashboardForecastInfoModal");
        const calendarModal = app.document.getElementById("dashboardCalendarInfoModal");
        assert(forecastModal && calendarModal, "情報ウィンドウがありません");
        try{
          app.openDashboardForecastInfoWindow();
          app.openDashboardCalendarInfoWindow();
          assert(forecastModal.classList.contains("show"), "収穫予測の情報ウィンドウが開きません");
          assert(calendarModal.classList.contains("show"), "カレンダーの情報ウィンドウが開きません");
          assertEqual(app.document.body.style.overflow, "hidden", "背景スクロールが止まりません");
          app.closeDashboardForecastInfoWindow();
          assert(!forecastModal.classList.contains("show"), "収穫予測の情報ウィンドウが閉じません");
          assertEqual(app.document.body.style.overflow, "hidden", "別のウィンドウが開いている間に背景スクロールが戻りました");
          app.closeDashboardCalendarInfoWindow();
          assert(!calendarModal.classList.contains("show"), "カレンダーの情報ウィンドウが閉じません");
          assertEqual(app.document.body.style.overflow, "", "すべて閉じた後に背景スクロールが元へ戻りません");
        }finally{
          app.closeDashboardForecastInfoWindow();
          app.closeDashboardCalendarInfoWindow();
        }

    }

    localStorage.clear();
    sessionStorage.clear();

    const iframe = document.createElement("iframe");
    let appsScriptIframe = null;
    iframe.title = "テスト対象のHarvestnavi";
    const timeout = setTimeout(() => {
      if(finished) return;
      const item = document.createElement("li");
      item.dataset.testStatus = "failed";
      item.textContent = "失敗: アプリの読み込みが20秒以内に完了しませんでした";
      results.appendChild(item);
      failedCount++;
      finish([iframe, appsScriptIframe]);
    }, 20000);

    iframe.addEventListener("load", async () => {
      if(finished) return;
      clearTimeout(timeout);
      try{
        appsScriptIframe = await loadAppsScriptHarness();
        await runCharacterizationTests(iframe, appsScriptIframe);
      }catch(error){
        const item = document.createElement("li");
        item.dataset.testStatus = "failed";
        item.textContent = `失敗: テスト基盤 — ${error?.message || String(error)}`;
        results.appendChild(item);
        failedCount++;
      }finally{
        finish([iframe, appsScriptIframe]);
      }
    }, { once: true });

    iframe.src = `../index.html?characterization-test=${Date.now()}`;
    document.body.appendChild(iframe);
  })();
  </script>
